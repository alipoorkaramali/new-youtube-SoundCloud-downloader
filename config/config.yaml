# ═══════════════════ پیکربندی اصلی ═══════════════════

# نام کانال تلگرام بدون @ (مثال: bbcpersian)
channel: "bbcpersian"

# تعداد پست‌هایی که از کانال واکشی می‌شود (پیشنهادی: ۳۵ برای آرشیو کامل، ۱۵ برای نمونه)
limit: 35

# حداکثر حجم مجاز برای دانلود هر فایل رسانه (مگابایت)
max_media_mb: 80

# پوشهٔ اصلی خروجی (همهٔ فایل‌های دانلودشده و گزارش‌ها اینجا ذخیره می‌شوند)
output_dir: "Download"

# پوشهٔ پروفایل دائمی مرورگر (همان که با save_session.py ساخته شد)
profile_dir: "config/browser_profile"

# فاصلهٔ زمانی (ثانیه) بین بارگذاری هر پست (جلوگیری از فشار روی تلگرام)
delay_between_posts: 1.5

# ═══════════════════ پارامترهای جدید (اختیاری) ═══════════════════

# 🔗 لینک شروع (اختیاری) – اگر مشخص شود، اسکریپت مستقیماً به آن پیام می‌رود
# و از آن نقطه شروع به اسکرول می‌کند. (مثال: "https://t.me/bbcpersian/12345")
start_link: ""

# 🧭 جهت اسکرول (اختیاری) – تعیین می‌کند که اسکرول به کدام سمت انجام شود:
#   "up"   → پست‌های قدیمی‌تر (بالاتر از نقطه شروع) – مناسب برای آرشیو
#   "down" → پست‌های جدیدتر (پایین‌تر از نقطه شروع) – مناسب برای دنبال کردن آخرین مطالب
# مقدار پیش‌فرض: "up"
scroll_direction: "up"

# 🔄 ادامه از آخرین نقطه (اختیاری) – مناسب برای اجرای مجدد دستی
# اگر true باشد، اسکریپت از آخرین پست استخراج‌شده در اجرای قبلی
# (قدیمی‌ترین پست) شروع کرده و به سمت بالا (پست‌های قدیمی‌تر) ادامه می‌دهد.
# در این حالت، start_link و scroll_direction نادیده گرفته می‌شوند.
# مرورگر بسته و دوباره باز می‌شود.
# مقدار پیش‌فرض: false
resume: false

# 🖼️ ذخیره اسکرین‌شات‌ها (اختیاری) – اگر false باشد، هیچ اسکرین‌شاتی گرفته نمی‌شود
# این گزینه سرعت اسکرپ را افزایش می‌دهد و حجم خروجی را کاهش می‌دهد.
# اسکرین‌شات‌های خطا نیز در صورت غیرفعال بودن ذخیره نمی‌شوند.
# مقدار پیش‌فرض: true
save_screenshots: true

# ⏱️ تایم‌اوت کلی اسکریپت (ثانیه) – در صورت سپری شدن، اسکریپت متوقف می‌شود
# (پیش‌فرض: ۲۱۰۰ ثانیه = ۳۵ دقیقه)
timeout_seconds: 2100
