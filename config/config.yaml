# ═══════════════════ پیکربندی اصلی ═══════════════════
# توکن Apify (از متغیر محیطی خوانده می‌شود – امن)
apify_token: "${APIFY_TOKEN}"

# نام کانال تلگرام بدون @ (مثال: bbcpersian)
channel: "bbcpersian"

# تعداد پست‌هایی که از آخرین پست کانال واکشی می‌شود
# مقادیر معقول: 10 تا 50 (هرچه بیشتر، مصرف اعتبار Apify بیشتر)
limit: 15

# حداکثر حجم مجاز برای دانلود هر فایل رسانه (مگابایت)
# فایل‌های بزرگ‌تر از این مقدار رد می‌شوند
max_media_mb: 80

# فایل ذخیره‌سازی کوکی‌های سشن تلگرام (همان session.json)
# نکته: اگر فایل session.json وجود نداشته باشد،
# اسکریپت به‌طور خودکار فایل session.json.gpg را با GPG رمزگشایی می‌کند
# (نیازمند متغیر محیطی GPG_PASSPHRASE)
session_file: "config/session"

# پوشهٔ اصلی خروجی (همهٔ فایل‌های دانلودشده و گزارش‌ها اینجا ذخیره می‌شوند)
output_dir: "Download"

# فاصلهٔ زمانی (ثانیه) بین درخواست‌ها به API تلگرام وب
# مقدار 1.5 امن است و از تشخیص ربات جلوگیری می‌کند
rate_limit: 1.5
