name: 📸 دریافت پست‌های اینستاگرام

on:
  workflow_dispatch:
    inputs:
      usernames:
        description: 'Optional usernames (comma-separated). Leave empty to use config/instagram_channels.txt'
        required: false
        default: ''
        type: string
      post_count:
        description: 'Posts per channel'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs
        run: |
          mkdir -p instagram_data config State
          if [ ! -f config/instagram_channels.txt ]; then
            printf '%s\n' '# one Instagram username per line' 'bbcpersian' > config/instagram_channels.txt
          fi

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install deps
        run: |
          pip install apify-client requests

      - name: 🚀 Fetch posts (all channels)
        env:
          USERNAMES_INPUT: ${{ github.event.inputs.usernames }}
          CHANNELS_FILE: config/instagram_channels.txt
          POST_COUNT: ${{ github.event.inputs.post_count }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          TOKEN_COUNTER_FILE: State/apify_token_counter.txt
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 📤 Commit JSON + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_data/ State/apify_token_counter.txt config/instagram_channels.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📸 Instagram fetch: update JSON / channel list"
          git push || true

      - name: ❌ Close previous open issues per channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f instagram_fetch_manifest.json ]; then
            echo "No manifest — nothing to close"
            exit 0
          fi
          python3 - <<'PY'
          import json, subprocess, os
          with open("instagram_fetch_manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          for entry in manifest.get("channels", []):
              if not entry.get("ok"):
                  continue
              username = entry["username"]
              print(f"🔍 Closing open issues for @{username} ...")
              r = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--search", f"in:title @{username}",
                   "--json", "number", "--jq", ".[].number"],
                  capture_output=True, text=True
              )
              nums = [n.strip() for n in r.stdout.splitlines() if n.strip()]
              if not nums:
                  print("  ✅ none open")
                  continue
              for num in nums:
                  subprocess.run([
                      "gh", "issue", "close", num, "--comment",
                      "Closed: refreshed by a new Instagram fetch run. You can still use `/download shortcode` on older issues if needed."
                  ], check=False)
                  print(f"  🔒 closed #{num}")
          PY

      - name: 📝 Create one Issue per channel
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/create_issue_with_posts.py
