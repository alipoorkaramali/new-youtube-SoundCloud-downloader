name: 📸 دریافت پست‌های اینستاگرام

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      usernames:
        description: 'Optional usernames (comma-separated). Leave empty to use config/instagram_channels.txt'
        required: false
        default: ''
        type: string
      add_to_list:
        description: 'Save these usernames into config/instagram_channels.txt for future runs?'
        required: false
        default: false
        type: boolean
      post_count:
        description: 'Posts per channel (schedule always uses 10)'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'
      force_refresh:
        description: 'Ignore last-post check and always re-fetch + recreate issues'
        required: false
        default: false
        type: boolean

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs
        run: |
          mkdir -p instagram_data config State
          if [ ! -f config/instagram_channels.txt ]; then
            printf '%s\n' '# one Instagram username per line' 'bbcpersian' > config/instagram_channels.txt
          fi

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install deps
        run: |
          pip install apify-client requests

      - name: 🚀 Fetch posts (all channels)
        env:
          USERNAMES_INPUT: ${{ github.event.inputs.usernames || '' }}
          ADD_TO_LIST: ${{ github.event.inputs.add_to_list || 'false' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CHANNELS_FILE: config/instagram_channels.txt
          POST_COUNT: ${{ github.event.inputs.post_count || '10' }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          TOKEN_COUNTER_FILE: State/apify_token_counter.txt
          STATE_FILE: State/instagram_channel_state.json
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 📤 Commit JSON + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_data/ State/ config/instagram_channels.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📸 Instagram fetch: update JSON / state / channel list"
          git push || true

      - name: 🗑️ Delete previous issues (channels with updates only)
        env:
          # Delete requires a PAT with admin/delete permission; GITHUB_TOKEN cannot delete issues
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ ! -f instagram_fetch_manifest.json ]; then
            echo "No manifest — nothing to delete"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_PAT is required to delete issues"
            exit 1
          fi
          python3 - <<'PY'
          import json, subprocess, os
          with open("instagram_fetch_manifest.json", encoding="utf-8") as f:
              manifest = json.load(f)
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          if not repo:
              raise SystemExit("GITHUB_REPOSITORY missing")

          for entry in manifest.get("channels", []):
              if not entry.get("ok") or not entry.get("issue_update"):
                  continue
              username = entry["username"]
              print(f"🗑️ Deleting old issues for @{username} ...")
              # open + closed so backlog is cleared
              r = subprocess.run(
                  [
                      "gh", "issue", "list",
                      "--state", "all",
                      "--search", f"in:title @{username} label:instagram-download",
                      "--limit", "50",
                      "--json", "number",
                      "--jq", ".[].number",
                  ],
                  capture_output=True, text=True,
              )
              nums = [n.strip() for n in r.stdout.splitlines() if n.strip().isdigit()]
              # fallback without label filter if none found
              if not nums:
                  r2 = subprocess.run(
                      [
                          "gh", "issue", "list",
                          "--state", "all",
                          "--search", f"in:title Instagram posts - @{username}",
                          "--limit", "50",
                          "--json", "number",
                          "--jq", ".[].number",
                      ],
                      capture_output=True, text=True,
                  )
                  nums = [n.strip() for n in r2.stdout.splitlines() if n.strip().isdigit()]

              if not nums:
                  print("  ✅ none found")
                  continue

              for num in nums:
                  del_r = subprocess.run(
                      ["gh", "api", "-X", "DELETE", f"repos/{repo}/issues/{num}"],
                      capture_output=True, text=True,
                  )
                  if del_r.returncode == 0:
                      print(f"  🗑️ deleted #{num}")
                  else:
                      err = (del_r.stderr or del_r.stdout or "").strip()[:200]
                      print(f"  ❌ delete #{num} failed: {err}")
          PY

      - name: 📝 Create one Issue per updated channel
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/create_issue_with_posts.py
