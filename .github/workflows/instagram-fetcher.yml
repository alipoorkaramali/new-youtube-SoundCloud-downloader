name: 📸 دریافت پست‌های اینستاگرام

on:
  schedule:
    # Every 6 hours (UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      usernames:
        description: 'Optional usernames (comma-separated). Leave empty to use config/instagram_channels.txt'
        required: false
        default: ''
        type: string
      add_to_list:
        description: 'Save these usernames into config/instagram_channels.txt for future runs?'
        required: false
        default: false
        type: boolean
      post_count:
        description: 'Posts per channel (schedule always uses 10)'
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'
      force_refresh:
        description: 'Ignore last-post check and always re-fetch + update issues'
        required: false
        default: false
        type: boolean

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📁 Prepare dirs
        run: |
          mkdir -p instagram_data config State
          if [ ! -f config/instagram_channels.txt ]; then
            printf '%s\n' '# one Instagram username per line' 'bbcpersian' > config/instagram_channels.txt
          fi

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install deps
        run: |
          pip install apify-client requests

      - name: 🚀 Fetch posts (all channels)
        env:
          USERNAMES_INPUT: ${{ github.event.inputs.usernames || '' }}
          ADD_TO_LIST: ${{ github.event.inputs.add_to_list || 'false' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          CHANNELS_FILE: config/instagram_channels.txt
          POST_COUNT: ${{ github.event.inputs.post_count || '10' }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          TOKEN_COUNTER_FILE: State/apify_token_counter.txt
          STATE_FILE: State/instagram_channel_state.json
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 📤 Commit JSON + state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_data/ State/ config/instagram_channels.txt 2>/dev/null || true
          git diff --staged --quiet || git commit -m "📸 Instagram fetch: update JSON / state / channel list"
          git push || true

      - name: 📝 Create or update Issue per channel
        env:
          GH_PAT: ${{ secrets.ISSUES_DELETE_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/create_issue_with_posts.py
