name: 📸 دریافت پست‌های اینستاگرام

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'نام کاربری پیج (بدون @)'
        required: true
        default: 'bbcpersian'
      post_count:
        description: 'تعداد پست'
        required: true
        default: '5'
        type: choice
        options:
          - '5'
          - '10'
          - '15'
          - '20'

jobs:
  fetch-and-create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: 📥 دریافت کد مخزن
        uses: actions/checkout@v4

      - name: 📁 آماده‌سازی پوشه instagram_data
        run: mkdir -p instagram_data

      - name: 🐍 تنظیم پایتون
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 نصب کتابخانه‌ها
        run: |
          pip install apify-client
          pip install requests

      - name: 🚀 دریافت پست‌ها با Apify (Round Robin)
        env:
          TARGET_USERNAME: ${{ github.event.inputs.username }}
          POST_COUNT: ${{ github.event.inputs.post_count }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
        run: python .github/scripts/fetch_instagram_apify.py

      - name: 💾 ذخیره JSON در instagram_data (با زمان)
        id: save
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          USERNAME="${{ github.event.inputs.username }}"
          NEW_FILE="instagram_data/${USERNAME}_${TIMESTAMP}.json"
          if [ -f instagram_posts.json ]; then
            cp instagram_posts.json "$NEW_FILE"
            echo "✅ فایل ذخیره شد: $NEW_FILE"
            echo "saved_file=$NEW_FILE" >> $GITHUB_OUTPUT
          else
            echo "❌ خطا: instagram_posts.json یافت نشد"
            exit 1
          fi

      - name: 📤 Commit و Push فایل JSON به مخزن
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_data/
          git diff --staged --quiet || git commit -m "📸 اضافه شدن JSON جدید برای @${{ github.event.inputs.username }}"
          git push

      - name: ❌ بستن ایشوهای قبلی برای همین پیج
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USERNAME="${{ github.event.inputs.username }}"
          echo "🔍 جستجوی ایشوهای باز با عنوان حاوی @$USERNAME ..."
          ISSUE_NUMBERS=$(gh issue list --state open --search "in:title @$USERNAME" --json number --jq '.[].number')
          if [ -z "$ISSUE_NUMBERS" ]; then
            echo "✅ هیچ ایشوی باز قبلی یافت نشد."
          else
            for num in $ISSUE_NUMBERS; do
              gh issue close "$num" --comment "این ایشو با درخواست جدید به‌روزرسانی شده و بسته می‌شود. اما همچنان می‌توانید با کامنت '/download shortcode' دانلود کنید."
              echo "🔒 ایشو #$num بسته شد."
            done
          fi

      - name: 📝 ایجاد Issue جدید با لیست پست‌ها
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python .github/scripts/create_issue_with_posts.py
