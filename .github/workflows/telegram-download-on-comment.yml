name: 📥 Telegram download on comment

on:
  issue_comment:
    types: [created]

# /download <number|https://t.me/ch/id> [audio|video] [mega|repo]

jobs:
  download:
    if: >
      contains(github.event.comment.body, '/download') &&
      github.event.issue.title == '📱 Telegram Catalog – Download'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Parse /download command
        id: parse
        run: |
          set -e
          COMMENT="${{ github.event.comment.body }}"
          LINE=$(echo "$COMMENT" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')

          TME=$(echo "$LINE" | grep -oiE 'https?://t\.me/[A-Za-z0-9_]+/[0-9]+' | head -1)
          NUM=""
          if [ -n "$TME" ]; then
            echo "ref_type=url" >> "$GITHUB_OUTPUT"
            echo "ref=$TME" >> "$GITHUB_OUTPUT"
            echo "number=" >> "$GITHUB_OUTPUT"
            REST=$(echo "$LINE" | sed -E 's|.*/download[[:space:]]+https?://t\.me/[A-Za-z0-9_]+/[0-9]+||I')
          else
            RAW=$(echo "$LINE" | grep -oiE '/download[[:space:]]+[0-9]+([[:space:]]+[a-zA-Z_]+)?([[:space:]]+[a-zA-Z_]+)?' | head -1)
            if [ -z "$RAW" ]; then
              echo "❌ فرمت: /download <شماره|t.me-url> [audio|video] [mega|repo]"
              exit 1
            fi
            NUM=$(echo "$RAW" | awk '{print $2}')
            echo "ref_type=number" >> "$GITHUB_OUTPUT"
            echo "ref=$NUM" >> "$GITHUB_OUTPUT"
            echo "number=$NUM" >> "$GITHUB_OUTPUT"
            REST=$(echo "$RAW" | awk '{print tolower($3" "$4)}')
          fi

          MODE=""; DEST=""
          for A in $REST; do
            A=$(echo "$A" | tr '[:upper:]' '[:lower:]')
            case "$A" in
              audio|mp3) MODE="audio" ;;
              video|default|manual) MODE="video" ;;
              mega) DEST="mega" ;;
              repo) DEST="repo" ;;
            esac
          done
          echo "$LINE" | grep -qiE '[[:space:]]audio([[:space:]]|$)' && MODE="audio"
          echo "$LINE" | grep -qiE '[[:space:]]video([[:space:]]|$)' && MODE="video"
          echo "$LINE" | grep -qiE '[[:space:]]mega([[:space:]]|$)' && DEST="mega"
          echo "$LINE" | grep -qiE '[[:space:]]repo([[:space:]]|$)' && DEST="repo"

          [ -z "$MODE" ] && MODE="video"
          [ -z "$DEST" ] && DEST="repo"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "dest=$DEST" >> "$GITHUB_OUTPUT"
          echo "📌 ref=${TME:-$NUM} mode=$MODE dest=$DEST"

      - name: Resolve target post
        id: item
        run: |
          REF_TYPE="${{ steps.parse.outputs.ref_type }}"
          REF="${{ steps.parse.outputs.ref }}"
          NUM="${{ steps.parse.outputs.number }}"
          python3 << 'PY'
          import json, os, re, sys
          from pathlib import Path

          ref_type = os.environ.get("REF_TYPE", "")
          ref = os.environ.get("REF", "")
          num = os.environ.get("NUM", "")

          channel = pid = url = text = ""

          if ref_type == "url" or (ref and "t.me" in ref):
              m = re.search(r"t\.me/([A-Za-z0-9_]+)/([0-9]+)", ref)
              if not m:
                  print("❌ لینک t.me نامعتبر")
                  sys.exit(1)
              channel, pid = m.group(1), m.group(2)
              url = f"https://t.me/{channel}/{pid}"
              idx_path = Path("State/telegram_catalog_index.json")
              if idx_path.exists():
                  try:
                      idx = json.loads(idx_path.read_text(encoding="utf-8"))
                      for v in idx.values():
                          if str(v.get("channel")) == channel and str(v.get("id")) == pid:
                              text = (v.get("text") or "")[:120]
                              break
                  except Exception:
                      pass
          else:
              idx_path = Path("State/telegram_catalog_index.json")
              if not idx_path.exists():
                  print("❌ catalog index نیست")
                  sys.exit(1)
              idx = json.loads(idx_path.read_text(encoding="utf-8"))
              item = idx.get(str(num))
              if not item:
                  print(f"❌ شماره {num} پیدا نشد")
                  sys.exit(1)
              channel = item["channel"]
              pid = str(item["id"])
              url = item.get("url") or f"https://t.me/{channel}/{pid}"
              text = (item.get("text") or "")[:120]

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"channel={channel}\n")
              out.write(f"post_id={pid}\n")
              out.write(f"url={url}\n")
              out.write(f"text={text}\n")
          print(f"channel={channel} id={pid} url={url}")
          PY
        env:
          REF_TYPE: ${{ steps.parse.outputs.ref_type }}
          REF: ${{ steps.parse.outputs.ref }}
          NUM: ${{ steps.parse.outputs.number }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps + ffmpeg
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Decrypt browser profile
        run: |
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
            --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          tar -xzf config/browser_profile.tar.gz -C config/

      - name: Patch scraper helpers
        run: |
          python3 .github/scripts/patch_scraper_scroll.py .github/scripts/scraper.py || true
          python3 .github/scripts/patch_stop_before.py .github/scripts/scraper.py || true
          python3 .github/scripts/patch_include_start_post.py .github/scripts/scraper.py || true

      - name: Write config for single-post media download
        run: |
          python3 << 'PY'
          import yaml
          from pathlib import Path
          cfg_path = Path("config/config.yaml")
          c = yaml.safe_load(cfg_path.read_text(encoding="utf-8")) if cfg_path.exists() else {}
          c = c or {}
          c["channel"] = "${{ steps.item.outputs.channel }}"
          c["start_link"] = "${{ steps.item.outputs.url }}"
          c["limit"] = 1
          c["include_start_post"] = True
          c["debug_mode"] = False
          c["resume"] = False
          c["scroll_direction"] = "up"
          c["save_screenshots"] = False
          c["max_media_mb"] = 80
          c["max_scroll_attempts"] = 8
          c["timeout_seconds"] = 0
          c["auto_extend_timeout"] = True
          c.pop("stop_before_id", None)
          cfg_path.write_text(yaml.dump(c, allow_unicode=True, default_flow_style=False), encoding="utf-8")
          print(c)
          PY

      - name: Clear old media (avoid uploading leftover posts)
        run: |
          CH="${{ steps.item.outputs.channel }}"
          PID="${{ steps.item.outputs.post_id }}"
          BASE="Download/telegram_downloads/${CH}"
          rm -rf "$BASE/media"
          mkdir -p "$BASE/media"
          echo "🧹 cleared $BASE/media (target post=$PID)"

      - name: Run scraper (media for one post)
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml

      - name: Check media for exact post id (not archive posts.json)
        env:
          CH: ${{ steps.item.outputs.channel }}
          PID: ${{ steps.item.outputs.post_id }}
        run: |
          BASE="Download/telegram_downloads/${CH}/media"
          echo "media dir after scrape:"
          ls -la "$BASE" 2>/dev/null || echo "(empty)"
          found=$(find "$BASE" -type f -name "${PID}_*" 2>/dev/null | head -5)
          if [ -n "$found" ]; then
            echo "✅ media for $PID:"
            echo "$found"
          else
            echo "⚠️ هنوز فایل ${PID}_* نیست — مرحله Collect تصمیم نهایی می‌گیرد"
          fi

      - name: Collect only this post media (exact PID only)
        id: media
        run: |
          set -e
          CH="${{ steps.item.outputs.channel }}"
          PID="${{ steps.item.outputs.post_id }}"
          BASE="Download/telegram_downloads/${CH}"
          STAGING="/tmp/telegram_dl_${CH}_${PID}"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"

          echo "📂 tree under $BASE (depth 3):"
          find "$BASE" -maxdepth 3 -type f 2>/dev/null | head -40 || true

          export BASE PID STAGING
          python3 << 'PY'
          import os, re, shutil, sys
          from pathlib import Path

          base = Path(os.environ["BASE"])
          pid = os.environ["PID"]
          staging = Path(os.environ["STAGING"])
          staging.mkdir(parents=True, exist_ok=True)

          media_re = re.compile(
              r"\.(mp4|mkv|webm|mov|avi|mp3|m4a|ogg|opus|wav|flac|aac|jpg|jpeg|png|gif|webp|pdf)$",
              re.I,
          )
          skip_name = re.compile(
              r"(screenshot|debug_|initial\.png|final\.png|before_click|search_|error_|_archive|_posts\.)",
              re.I,
          )
          skip_dir = re.compile(r"(post_screenshots|/screenshots/|/debug_screenshots/|/debug_rightclick/)", re.I)

          def is_exact_pid(f: Path, rel: str) -> bool:
              parts = rel.split("/")
              if "media" in parts:
                  try:
                      i = parts.index("media")
                      if i + 1 < len(parts) and parts[i + 1] == pid:
                          return True
                  except ValueError:
                      pass
              if f.name.startswith(pid + "_") or f.name.startswith(pid + "."):
                  return True
              if re.match(r"^[0-9]+_", f.name):
                  return f.name.split("_", 1)[0] == pid
              return False

          exact = []
          if base.exists():
              for f in base.rglob("*"):
                  if not f.is_file():
                      continue
                  rel = str(f.relative_to(base)).replace("\\", "/")
                  if skip_dir.search(rel):
                      continue
                  if skip_name.search(f.name) or skip_name.search(rel):
                      continue
                  if not media_re.search(f.name):
                      continue
                  if not is_exact_pid(f, rel):
                      print(f"skip non-exact: {rel}")
                      continue
                  exact.append(f)

          exact.sort(key=lambda p: p.stat().st_mtime, reverse=True)

          copied = 0
          seen_names = set()
          for f in exact:
              if f.name in seen_names:
                  continue
              seen_names.add(f.name)
              dest = staging / f.name
              shutil.copy2(f, dest)
              copied += 1
              print(f"+ EXACT {f.relative_to(base)}")

          print(f"📦 staged {copied} EXACT media file(s) for post {pid}")
          if copied == 0:
              print(f"❌ هیچ فایل مدیایی با post id دقیق {pid} پیدا نشد — آپلود نمی‌شود")
              mdir = base / "media"
              if mdir.exists():
                  print("media/ contents:")
                  for x in sorted(mdir.rglob("*"))[:40]:
                      if x.is_file():
                          print(" ", x.relative_to(base))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"folder={staging}\n")
              out.write(f"count={copied}\n")
          if copied == 0:
              sys.exit(1)
          PY
          ls -la "$STAGING" || true

      - name: Extract audio if mode=audio
        if: steps.parse.outputs.mode == 'audio'
        run: |
          FOLDER="${{ steps.media.outputs.folder }}"
          mkdir -p "$FOLDER"
          cd "$FOLDER"
          find . -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.mkv' -o -iname '*.webm' -o -iname '*.mov' \) | while read -r f; do
            name="${f%.*}"
            out="${name}.mp3"
            if ffmpeg -y -i "$f" -vn -acodec libmp3lame -q:a 4 "$out" 2>/dev/null; then
              echo "✅ $f → $out"
              rm -f "$f"
            else
              echo "⚠️ keep $f"
            fi
          done

      - name: Commit to repo (dest=repo)
        if: steps.parse.outputs.dest == 'repo'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CH="${{ steps.item.outputs.channel }}"
          PID="${{ steps.item.outputs.post_id }}"
          STAGING="${{ steps.media.outputs.folder }}"
          DEST_DIR="Download/telegram_downloads/${CH}/media/${PID}"
          mkdir -p "$DEST_DIR"
          if [ -d "$STAGING" ] && [ "$(ls -A "$STAGING" 2>/dev/null)" ]; then
            cp -n "$STAGING"/* "$DEST_DIR/" 2>/dev/null || cp "$STAGING"/* "$DEST_DIR/"
          fi
          git add "$DEST_DIR" || true
          git reset HEAD -- "Download/telegram_downloads/${CH}/post_screenshots" 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No new media files to commit"
          else
            git commit -m "Add Telegram media @${CH} post ${PID} (${{ steps.parse.outputs.mode }})"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Upload to Mega (dest=mega)
        id: mega
        if: steps.parse.outputs.dest == 'mega'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_PAT1 || secrets.GITHUB_TOKEN }}
          RCLONE_PASSPHRASE: ${{ secrets.RCLONE_PASSPHRASE }}
        run: |
          set -e
          FOLDER="${{ steps.media.outputs.folder }}"
          CH="${{ steps.item.outputs.channel }}"
          PID="${{ steps.item.outputs.post_id }}"
          MEGA_PATH="mega:TelegramNews/${CH}/${PID}"

          if [ ! -d "$FOLDER" ] || [ -z "$(ls -A "$FOLDER" 2>/dev/null)" ]; then
            echo "❌ پوشه مدیا خالی — چیزی به Mega آپلود نمی‌شود"
            echo "mega_path=" >> "$GITHUB_OUTPUT"
            echo "links=" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          find "$FOLDER" -type f \( \
            -iname '*screenshot*' -o -iname 'debug_*.png' -o -iname 'initial.png' \
            -o -iname 'final.png' -o -iname 'before_click*' -o -iname 'search_*.png' \
          \) -delete 2>/dev/null || true

          if [ ! -f config/rclone_mega.conf.gpg ]; then
            API="https://api.github.com/repos/alipoorkaramali/youtube-SoundCloud-downloader/contents/config/rclone_mega.conf.gpg"
            curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
              "$API" | python3 -c '
          import json,sys,base64
          d=json.load(sys.stdin)
          if "content" not in d:
              print("FAIL", d.get("message", d), file=sys.stderr); sys.exit(1)
          open("config/rclone_mega.conf.gpg","wb").write(base64.b64decode(d["content"]))
          '
          fi
          if [ -z "$RCLONE_PASSPHRASE" ]; then
            echo "❌ RCLONE_PASSPHRASE required"; exit 1
          fi
          mkdir -p ~/bin ~/.config/rclone
          if ! command -v rclone >/dev/null 2>&1; then
            curl -sL https://rclone.org/install.sh | sudo bash
          fi
          RCLONE=$(command -v rclone)
          gpg --batch --yes --passphrase "$RCLONE_PASSPHRASE" \
            --output ~/.config/rclone/rclone.conf --decrypt config/rclone_mega.conf.gpg
          chmod 600 ~/.config/rclone/rclone.conf
          $RCLONE --config ~/.config/rclone/rclone.conf mkdir "$MEGA_PATH" 2>/dev/null || true
          $RCLONE --config ~/.config/rclone/rclone.conf copy "$FOLDER" "$MEGA_PATH" --progress \
            --exclude "*screenshot*" --exclude "debug_*" --exclude "post_screenshots/**"
          LINKS=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            L=$($RCLONE --config ~/.config/rclone/rclone.conf link "$MEGA_PATH/$f" 2>/dev/null || echo "")
            LINKS="${LINKS}- ${f}: ${L}\n"
          done < <($RCLONE --config ~/.config/rclone/rclone.conf lsf "$MEGA_PATH" 2>/dev/null | head -20)
          {
            echo "mega_path=$MEGA_PATH"
            echo "links<<EOF"
            echo -e "$LINKS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ steps.parse.outputs.mode }}"
          DEST="${{ steps.parse.outputs.dest }}"
          CH="${{ steps.item.outputs.channel }}"
          PID="${{ steps.item.outputs.post_id }}"
          URL="${{ steps.item.outputs.url }}"
          COUNT="${{ steps.media.outputs.count }}"
          MEGA_PATH="${{ steps.mega.outputs.mega_path }}"
          MEGA_LINKS="${{ steps.mega.outputs.links }}"
          BODY=$(mktemp)
          {
            echo "✅ دانلود تلگرام انجام شد."
            echo ""
            echo "- **کانال:** @${CH}"
            echo "- **post id:** \`${PID}\`"
            echo "- **حالت:** ${MODE} · **مقصد:** ${DEST}"
            echo "- **فایل‌های مدیا:** ${COUNT}"
            echo "- **لینک:** ${URL}"
            if [ "$DEST" = "mega" ]; then
              echo "- **Mega:** \`${MEGA_PATH}\`"
              echo -e "${MEGA_LINKS}"
            else
              echo "- **مسیر:** \`Download/telegram_downloads/${CH}/media/${PID}\`"
            fi
          } > "$BODY"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY"

      - name: Comment failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در دانلود. لاگ Actions را ببینید. فرمت: \`/download <n|t.me-url> [audio|video] [mega|repo]\`"
