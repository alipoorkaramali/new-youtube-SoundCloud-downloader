name: fix-scrape-yml
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble
        run: |
          set -e
          curl -sL "https://raw.githubusercontent.com/alipoorkaramali/new-youtube-SoundCloud-downloader/d5c1217d6298c8a856b3cc455b4b75be00c97df2/.github/workflows/Scrape%20Telegram.yml" -o /tmp/base.yml
          test $(wc -c < /tmp/base.yml) -gt 10000
          echo "" | base64 -d > /tmp/job.yml
          cat /tmp/base.yml /tmp/job.yml > ".github/workflows/Scrape Telegram.yml"
          wc -c ".github/workflows/Scrape Telegram.yml"
          grep -n update-catalog ".github/workflows/Scrape Telegram.yml"
          rm -f .github/workflows/telegram-catalog-update.yml
          rm -f .github/workflows/fix-scrape-yml.yml
          rm -rf .github/_merge
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(telegram): catalog Issue update inside Scrape workflow"
          git pull --rebase origin main || true
          git push origin main
