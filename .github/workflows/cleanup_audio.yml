name: Cleanup audio files older than 12 hours

on:
  schedule:
    - cron: '0 0 * * *'   # هر روز ساعت 00:00 UTC
  workflow_dispatch:       # اجرای دستی

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run cleanup
        run: python cleanup_audio_by_age.py
