name: Cleanup old audio files

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'فقط نمایش (بدون حذف)'
        required: false
        default: false
        type: boolean
      max_age_hours:
        description: 'حداکثر سن بر حسب ساعت (پیش‌فرض 12)'
        required: false
        default: 12
        type: number

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # اجازه push به مخزن
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: اجرای اسکریپت پاکسازی
        id: cleanup
        run: |
          CMD="python .github/scripts/cleanup_audio_by_age.py"
          if [[ "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            CMD="$CMD --dry-run"
          fi
          if [[ -n "${{ github.event.inputs.max_age_hours }}" ]]; then
            CMD="$CMD --max-age ${{ github.event.inputs.max_age_hours }}"
          fi
          echo "Running: $CMD"
          $CMD
      - name: Commit changes to upload times file
        if: github.event.inputs.dry_run != 'true'   # فقط در حالت واقعی
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add State/upload_times_Download_audio_downloads.txt
          if git diff --cached --quiet; then
            echo "هیچ تغییری در فایل زمان‌بندی ایجاد نشده است."
          else
            git commit -m "Auto-cleanup: update upload times file (removed old records)"
            git push
          fi
