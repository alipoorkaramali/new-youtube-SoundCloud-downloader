name: 📥 دانلود اینستاگرام و ذخیره در مخزن

on:
  issue_comment:
    types: [created]

jobs:
  download:
    if: contains(github.event.comment.body, '/download')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: استخراج shortcode
        id: sc
        run: |
          COMMENT="${{ github.event.comment.body }}"
          SHORTCODE=$(echo "$COMMENT" | grep -oE '/download[[:space:]]+([A-Za-z0-9_-]+)' | awk '{print $2}' | head -1)
          if [ -z "$SHORTCODE" ]; then
            echo "❌ فرمت صحیح نیست. از /download <shortcode> استفاده کنید."
            exit 1
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT
          echo "📌 shortcode=$SHORTCODE"

      - name: استخراج username از عنوان Issue
        id: channel
        run: |
          TITLE="${{ github.event.issue.title }}"
          # e.g. "📸 Instagram posts - @bbcpersian"
          USER=$(echo "$TITLE" | grep -oE '@[A-Za-z0-9._]+' | head -1 | tr -d '@')
          if [ -z "$USER" ]; then
            USER=""
          fi
          echo "username=$USER" >> $GITHUB_OUTPUT
          echo "📌 issue channel hint: ${USER:-none}"

      - name: 🔐 رمزگشایی کوکی اینستاگرام از config/INSTAGRAM_COOCKIES.txt.gpg
        run: |
          COOKIE_GPG="config/INSTAGRAM_COOCKIES.txt.gpg"
          if [ ! -f "$COOKIE_GPG" ]; then
            echo "⚠️ فایل $COOKIE_GPG یافت نشد. کوکی در دسترس نیست."
            exit 0
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" --decrypt "$COOKIE_GPG" > cookies.txt
          if [ ! -s cookies.txt ]; then
            echo "❌ رمزگشایی کوکی ناموفق بود یا فایل خالی است"
            exit 1
          fi
          echo "✅ کوکی با موفقیت رمزگشایی شد از $COOKIE_GPG"
          echo "INSTAGRAM_COOKIES_PATH=$(pwd)/cookies.txt" >> $GITHUB_ENV

      - name: نصب Python و کتابخانه‌ها
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install --upgrade yt-dlp requests

      - name: 📦 نصب ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          echo "✅ ffmpeg نصب شد"

      - name: دانلود پست
        env:
          ISSUE_USERNAME: ${{ steps.channel.outputs.username }}
        run: python .github/scripts/download_with_fallback.py ${{ steps.sc.outputs.shortcode }}

      - name: خواندن نام کاربری و مسیر نهایی
        id: info
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          # مسیر واقعی: Download/instagram_downloads/{username}/{shortcode}
          FOUND=$(find Download/instagram_downloads -mindepth 2 -maxdepth 2 -type d -name "$SHORTCODE" 2>/dev/null | head -1)
          if [ -z "$FOUND" ]; then
            echo "username=unknown" >> $GITHUB_OUTPUT
            echo "fullpath=Download/instagram_downloads/unknown/$SHORTCODE" >> $GITHUB_OUTPUT
          else
            USERNAME=$(basename "$(dirname "$FOUND")")
            echo "username=$USERNAME" >> $GITHUB_OUTPUT
            echo "fullpath=$FOUND" >> $GITHUB_OUTPUT
            echo "📁 found: $FOUND"
          fi
          echo "shortcode=$SHORTCODE" >> $GITHUB_OUTPUT

      - name: 📽️ فشرده‌سازی ویدیوها (حداکثر کم کردن حجم)
        run: |
          FULLPATH="${{ steps.info.outputs.fullpath }}"

          if [ ! -d "$FULLPATH" ]; then
            echo "⚠️ مسیر پیدا نشد: $FULLPATH"
            exit 0
          fi

          cd "$FULLPATH"

          echo "📽️ شروع فشرده‌سازی ویدیوها..."
          echo "محتویات قبل از فشرده‌سازی:"
          ls -lh

          # فشرده‌سازی تمام فایل‌های ویدیویی
          find . -maxdepth 1 -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.m4v" -o -iname "*.webm" -o -iname "*.mkv" \) | while read -r file; do
            filename=$(basename "$file")
            name="${filename%.*}"
            ext="${filename##*.}"
            tmpfile="${name}_compressed.mp4"

            ORIG_SIZE=$(du -h "$file" | cut -f1)
            echo ""
            echo "🔄 فشرده‌سازی: $filename ($ORIG_SIZE)"

            # تنظیمات تجاوبی برای کم کردن حجم (مشابه روح دانلودر یوتیوب):
            # - حداکثر 720p (برای ویدیوهای عمودی و افقی)
            # - CRF 28 (فشرده‌سازی قوی)
            # - preset medium (تعادل سرعت/حجم)
            # - صدای AAC 64k
            # - yuv420p + faststart
            if ffmpeg -y -i "$file" \
              -c:v libx264 \
              -preset medium \
              -crf 28 \
              -vf "scale='min(720,iw)':min'(720,ih)':force_original_aspect_ratio=decrease,scale=trunc(iw/2)*2:trunc(ih/2)*2" \
              -c:a aac \
              -b:a 64k \
              -ac 2 \
              -ar 44100 \
              -movflags +faststart \
              -pix_fmt yuv420p \
              "$tmpfile" 2>/dev/null; then

              NEW_SIZE=$(du -h "$tmpfile" | cut -f1)
              ORIG_BYTES=$(stat -c%s "$file")
              NEW_BYTES=$(stat -c%s "$tmpfile")

              # فقط اگر فایل جدید کوچک‌تر شد جایگزین کن
              if [ "$NEW_BYTES" -lt "$ORIG_BYTES" ]; then
                mv -f "$tmpfile" "${name}.mp4"
                # اگر اسم قبلی متفاوت بود، فایل قدیمی را حذف کن
                if [ "$filename" != "${name}.mp4" ]; then
                  rm -f "$file"
                fi
                echo "✅ فشرده شد: $ORIG_SIZE → $NEW_SIZE"
              else
                rm -f "$tmpfile"
                echo "⚠️ فشرده‌سازی حجم را کم نکرد — فایل اصلی نگه داشته شد"
              fi
            else
              rm -f "$tmpfile" 2>/dev/null || true
              echo "❌ خطا در فشرده‌سازی $filename — فایل اصلی نگه داشته شد"
            fi
          done

          echo ""
          echo "📁 محتویات بعد از فشرده‌سازی:"
          ls -lh

      - name: 📦 Split large files (>30MB) into zip parts
        run: |
          FULLPATH="${{ steps.info.outputs.fullpath }}"

          if [ ! -d "$FULLPATH" ]; then
            echo "⚠️ مسیر پیدا نشد: $FULLPATH"
            exit 0
          fi

          cd "$FULLPATH"

          # پیدا کردن فایل‌های بزرگ‌تر از ۳۰ مگابایت
          find . -maxdepth 1 -type f -size +30M | while read -r file; do
            filename=$(basename "$file")
            name="${filename%.*}"

            echo "📦 فایل بزرگ پیدا شد: $filename ($(du -h "$file" | cut -f1))"

            # ساخت زیپ چندقسمتی (هر قسمت حداکثر ۳۰ مگابایت)
            zip -s 30m -9 "${name}.zip" "$filename"

            # حذف فایل اصلی
            rm -f "$filename"

            echo "✅ تبدیل شد به:"
            ls -lh "${name}".z* "${name}.zip" 2>/dev/null || true
          done

          echo "📁 محتویات نهایی پوشه:"
          ls -lh

      - name: Commit and push downloaded files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Download/instagram_downloads/
          if git diff --staged --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Add downloaded Instagram post ${{ steps.sc.outputs.shortcode }} (@${{ steps.info.outputs.username }})"
            git push
          fi

      - name: Comment success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORTCODE="${{ steps.sc.outputs.shortcode }}"
          USERNAME="${{ steps.info.outputs.username }}"
          FULLPATH="${{ steps.info.outputs.fullpath }}"
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"

          # لیست فایل‌ها برای نمایش در کامنت
          FILE_LIST=$(ls -1 "$FULLPATH" 2>/dev/null | head -20)
          FIRST_FILE=$(echo "$FILE_LIST" | head -1)

          if [ -n "$FIRST_FILE" ]; then
            FILE_URL="https://github.com/${REPO}/blob/${BRANCH}/${FULLPATH}/${FIRST_FILE}"
          else
            FILE_URL="https://github.com/${REPO}/tree/${BRANCH}/${FULLPATH}"
          fi

          BODY=$(mktemp)
          echo "✅ پست \`$SHORTCODE\` با موفقیت ذخیره شد." >> "$BODY"
          echo "👤 کانال: @$USERNAME" >> "$BODY"
          echo "📁 مسیر: \`${FULLPATH}/\`" >> "$BODY"
          echo "🔗 مشاهده: ${FILE_URL}" >> "$BODY"

          # اگر فایل زیپ شده باشد توضیح بده
          if ls "$FULLPATH"/*.z* 1>/dev/null 2>&1 || ls "$FULLPATH"/*.zip 1>/dev/null 2>&1; then
            echo "" >> "$BODY"
            echo "📦 **فایل بزرگ به چند قسمت زیپ تبدیل شد** (برای جلوگیری از محدودیت 100MB گیت‌هاب)" >> "$BODY"
            echo "برای استخراج از **7-Zip** یا **WinRAR** استفاده کنید و همه قسمت‌ها را با هم انتخاب کنید." >> "$BODY"
          fi

          gh issue comment "${{ github.event.issue.number }}" --body-file "$BODY"

      - name: Comment error
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body "❌ خطا در shortcode ${{ steps.sc.outputs.shortcode }}. لطفاً لاگ را بررسی کنید."
