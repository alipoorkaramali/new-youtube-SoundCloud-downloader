name: Sync rclone Mega config

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch encrypted rclone config from youtube-SoundCloud-downloader
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GH_PAT1 || secrets.GITHUB_TOKEN }}
        run: |
          set -e
          mkdir -p config
          API="https://api.github.com/repos/alipoorkaramali/youtube-SoundCloud-downloader/contents/config/rclone_mega.conf.gpg"
          curl -sL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
            "$API" | python3 -c '
          import json,sys,base64
          d=json.load(sys.stdin)
          if "content" not in d:
              print("FAIL", d.get("message", d), file=sys.stderr)
              sys.exit(1)
          open("config/rclone_mega.conf.gpg","wb").write(base64.b64decode(d["content"]))
          print("OK size", len(base64.b64decode(d["content"])))
          '
          file config/rclone_mega.conf.gpg
          ls -la config/rclone_mega.conf.gpg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/rclone_mega.conf.gpg
          if git diff --staged --quiet; then
            echo "No change"
          else
            git commit -m "chore(config): sync rclone_mega.conf.gpg for Mega comment downloads"
            git pull --rebase origin main || true
            git push origin main
          fi
