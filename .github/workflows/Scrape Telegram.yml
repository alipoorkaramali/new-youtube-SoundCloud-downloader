name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (برای مسیر خروجی، حتی اگر start_link دارید)'
        required: true
        default: 'bbcpersian'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری، برای جستجوی دقیق‌تر)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم به یک پست (اختیاری، مثال: https://t.me/example/123)'
        required: false
        default: ''
      scroll_direction:
        description: 'جهت اسکرول (اگر resume فعال باشد، این گزینه نادیده گرفته می‌شود و روی up تنظیم می‌گردد)'
        required: false
        default: 'up'
        type: choice
        options:
          - 'up'
          - 'down'
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '35'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت اسکریپ بدون دانلود مدیا (فقط استخراج پست‌ها)'
        type: boolean
        required: false
        default: false
      resume:
        description: 'ادامه از آخرین پست (اگر فعال باشد، start_link نادیده گرفته می‌شود و جهت اسکرول خودکار روی up تنظیم می‌گردد)'
        type: boolean
        required: false
        default: false
      save_screenshots:
        description: 'ذخیره اسکرین‌شات‌ها (غیرفعال کردن آن سرعت را تا ۳۰٪ افزایش می‌دهد و حجم خروجی را بسیار کاهش می‌دهد)'
        type: boolean
        required: false
        default: false
      save_to:
        description: 'محل ذخیره‌سازی خروجی‌ها (در صورت انتخاب دستی، override می‌شود)'
        required: true
        type: choice
        default: 'artifact'
        options:
          - 'artifact'
          - 'repository'
      timeout_seconds:
        description: 'حداکثر زمان اجرا به ثانیه (۰ = استفاده از پیش‌فرض کد)'
        required: false
        default: '0'
      auto_extend_timeout:
        description: 'تمدید خودکار زمان در صورت ادامهٔ موفق اسکرپینگ'
        type: boolean
        required: false
        default: true      
      max_scroll_attempts:
        description: 'حداکثر تعداد تلاش‌های اسکرول ناموفق (پیشرفته)'
        required: false
        default: '12' 

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # ════════════════════════════════════════════
      # ۱. دریافت کد از مخزن (فقط آخرین commit)
      # ════════════════════════════════════════════
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1
      - name: 🔍 Validate Inputs
        run: |
          if [[ -z "${{ github.event.inputs.channel }}" ]]; then
            echo "❌ channel نمی‌تواند خالی باشد"
            exit 1
          fi
          echo "✅ ورودی‌ها معتبر هستند"
      # ════════════════════════════════════════════
      # ۲. تنظیم پایتون
      # ════════════════════════════════════════════
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ════════════════════════════════════════════
      # ۳. کش بسته‌های pip
      # ════════════════════════════════════════════
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ════════════════════════════════════════════
      # ۴. نصب وابستگی‌های پایتون (شامل beautifulsoup4 و lxml)
      # ════════════════════════════════════════════
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ════════════════════════════════════════════
      # ۵. کش مرورگر Playwright
      # ════════════════════════════════════════════
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ════════════════════════════════════════════
      # ۶. نصب Playwright و کرومیوم
      # ════════════════════════════════════════════
      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
          
      # ════════════════════════════════════════════
      # ۷. رمزگشایی پروفایل مرورگر
      # ════════════════════════════════════════════
      - name: 🔓 Decrypt browser profile
        run: |
          if [ ! -f config/browser_profile.tar.gz.gpg ]; then
            echo "❌ فایل config/browser_profile.tar.gz.gpg یافت نشد!"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          if [ ! -s config/browser_profile.tar.gz ]; then
            echo "❌ رمزگشایی پروفایل ناموفق بود یا فایل خالی است"
            exit 1
          fi
          if ! tar tzf config/browser_profile.tar.gz >/dev/null 2>&1; then
            echo "❌ فایل پروفایل معتبر نیست (tar قادر به باز کردن آن نیست)"
            exit 1
          fi
          echo "✅ پروفایل با موفقیت رمزگشایی شد و معتبر است"

      # ════════════════════════════════════════════
      # ۸. استخراج پروفایل مرورگر
      # ════════════════════════════════════════════
      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      # ════════════════════════════════════════════
      # ۹. به‌روزرسانی فایل تنظیمات با ورودی‌ها (با تبدیل صحیح بولین)
      # ════════════════════════════════════════════
      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f) or {}
          
          # پارامترهای اجباری
          c['channel'] = '${{ github.event.inputs.channel }}' or 'unknown'
          c['channel_name'] = '${{ github.event.inputs.channel_name }}' or ''
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}

          c['max_scroll_attempts'] = int('${{ github.event.inputs.max_scroll_attempts }}')

          # 🔄 resume: تبدیل رشته به بولین (رفع خطای true/True)
          resume_val = '${{ github.event.inputs.resume }}'.lower() == 'true'
          c['resume'] = resume_val

          if resume_val:
              c.pop('start_link', None)
              c['scroll_direction'] = 'up'
              c['max_scroll_attempts'] = 12   # رونویسی برای حالت resume
          else:
              start_link = '${{ github.event.inputs.start_link }}'.strip()
              if start_link:
                  c['start_link'] = start_link
              else:
                  c.pop('start_link', None)
              c['scroll_direction'] = '${{ github.event.inputs.scroll_direction }}' or 'up'
          
          # 🖼️ save_screenshots: ذخیره اسکرین‌شات‌ها
          save_screenshots_val = '${{ github.event.inputs.save_screenshots }}'.lower() == 'true'
          c['save_screenshots'] = save_screenshots_val
          
          # debug_mode (اختیاری، برای هماهنگی)
          debug_val = '${{ github.event.inputs.debug_mode }}'.lower() == 'true'
          c['debug_mode'] = debug_val
          c['timeout_seconds'] = int('${{ github.event.inputs.timeout_seconds }}')
          c['auto_extend_timeout'] = '${{ github.event.inputs.auto_extend_timeout }}'.lower() == 'true'
          
          # ذخیره فایل
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          "

      # ════════════════════════════════════════════
      # ۱۰. پاکسازی خروجی قبلی (فقط در صورتی که Resume فعال نباشد)
      # ════════════════════════════════════════════
      - name: 🧹 Clean old output for this channel
        if: ${{ !inputs.resume && inputs.save_to == 'repository' }}
        run: rm -rf "Download/telegram_downloads/${{ github.event.inputs.channel }}"

      # ════════════════════════════════════════════
      # ۱۱. تعیین حالت ذخیره‌سازی هوشمند (پیش‌فرض بر اساس debug_mode)
      # ════════════════════════════════════════════
      - name: 🤖 Smart Save Mode (Default based on debug_mode)
        id: save_mode
        run: |
          if [[ "${{ inputs.debug_mode }}" == "true" ]]; then
            DEFAULT_SAVE="artifact"
            MODE_MSG="Debug Mode ON → Default: Artifact"
          else
            DEFAULT_SAVE="repository"
            MODE_MSG="Normal Mode → Default: Repository"
          fi
          echo "DEFAULT_SAVE=$DEFAULT_SAVE" >> $GITHUB_OUTPUT
          echo "::notice title=📌 Smart Save Mode::$MODE_MSG | Debug=${{ inputs.debug_mode }} | Default=$DEFAULT_SAVE"

      # ════════════════════════════════════════════
      # ۱۲. اجرای اسکریپر (عادی یا دیباگ)
      # ════════════════════════════════════════════
      - name: 🚀 Run Telegram Scraper (with media download)
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml


      - name: 📝 Run Debug Scraper (no media download)
        if: ${{ inputs.debug_mode }}
        run: xvfb-run python .github/scripts/debug_scraper.py


      # ════════════════════════════════════════════
      # ۱۳. پاکسازی آرتیفکت‌های قدیمی دیباگ
      # ════════════════════════════════════════════
      - name: 🧹 Delete old debug screenshots artifacts
        if: ${{ inputs.save_to == 'artifact' }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("debug-screenshots-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Compress debug screenshots
        if: ${{ inputs.save_to == 'artifact' && inputs.debug_mode }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ -d "$OUTPUT_DIR/debug_screenshots" ]; then
            cd "$OUTPUT_DIR"
            tar -czf debug_screenshots.tar.gz debug_screenshots/
            rm -rf debug_screenshots/   # پاک کردن پوشه اصلی
            echo "✅ debug_screenshots compressed and cleaned"
          fi
      # ════════════════════════════════════════════
      # ۱۴. آپلود اسکرین‌شات‌های دیباگ
      # ════════════════════════════════════════════
      - name: 📤 Upload debug screenshots
        if: ${{ inputs.save_to == 'artifact' && inputs.debug_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/debug_screenshots.tar.gz

      # ════════════════════════════════════════════
      # ۱۵. بررسی خروجی (همیشه)
      # ════════════════════════════════════════════
      - name: 📊 Verify output
        if: ${{ always() }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output directory is ready"

      - name: 📋 Summary of results
        if: ${{ always() }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          CHANNEL="${{ github.event.inputs.channel }}"
          JSON_FILE="$OUTPUT_DIR/${CHANNEL}_posts.json"
          echo "📁 خروجی: $OUTPUT_DIR"
          if [ -f "$JSON_FILE" ]; then
            POST_COUNT=$(python -c "import json; print(len(json.load(open('$JSON_FILE'))))")
            echo "📊 تعداد پست‌ها: $POST_COUNT"
          else
            echo "⚠️ فایل JSON یافت نشد: $JSON_FILE"
          fi
          echo "💾 حجم کل خروجی:"
          du -sh "$OUTPUT_DIR" 2>/dev/null || echo "0"
          echo "📸 تعداد اسکرین‌شات‌ها:"
          ls "$OUTPUT_DIR/post_screenshots/" 2>/dev/null | wc -l
      # ════════════════════════════════════════════
      # ۱۶. تنظیم Git LFS
      # ════════════════════════════════════════════
      - name: 🐘 Setup Git LFS track for media & screenshots
        if: ${{ always() }}
        run: |
          git lfs install
          mkdir -p "Download/telegram_downloads/${{ github.event.inputs.channel }}/media"
          mkdir -p "Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots"
          git lfs track "Download/telegram_downloads/**/media/*" || true
          git lfs track "Download/telegram_downloads/**/post_screenshots/*" || true
          git add .gitattributes

      # ════════════════════════════════════════════
      # ۱۷. کامیت و آپلود نتایج
      # ════════════════════════════════════════════
      - name: 🔄 Pull latest changes before staging
        if: ${{ inputs.save_to == 'repository' }}
        run: |
          git config pull.rebase true
          git pull --rebase --autostash origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🗃 Stage all generated files for commit
        if: ${{ inputs.save_to == 'repository' }}
        run: |
          echo "📂 مسیر خروجی: Download/telegram_downloads/${{ github.event.inputs.channel }}"
          ls -la "Download/telegram_downloads/${{ github.event.inputs.channel }}" || echo "پوشه خالی است"
          git add "Download/telegram_downloads/${{ github.event.inputs.channel }}/**" 2>/dev/null || true
          git add .gitattributes
          echo "📋 وضعیت فایل‌های staged:"
          git status --short
          
      - name: 💾 Commit and push results
        if: ${{ inputs.save_to == 'repository' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }}, direction=${{ github.event.inputs.scroll_direction }}, resume=${{ github.event.inputs.resume }})"
          file_pattern: "Download/telegram_downloads/**"
          branch: ${{ github.ref_name }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          add_options: "--force"
          push_options: "--force-with-lease"

      # ════════════════════════════════════════════
      # ۱۸. پاکسازی آرتیفکت‌های قدیمی پست‌ها
      # ════════════════════════════════════════════
      - name: 🧹 Delete old post screenshots artifacts
        if: ${{ inputs.save_to == 'artifact' }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("post-screenshots-${{ github.event.inputs.channel }}-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ════════════════════════════════════════════
      # ۱۹. آپلود اسکرین‌شات‌های هر پست (همیشه)
      # ════════════════════════════════════════════
      - name: 📸 Upload post screenshots
        uses: actions/upload-artifact@v4
        if: ${{ inputs.save_to == 'artifact' && always() }}
        with:
          name: post-screenshots-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots/
