name: 🌀 Scrape Telegram & Save Archive

on:
  schedule:
    - cron: '0 * * * *'
  repository_dispatch:
    types: [telegram-news-hourly, telegram-news-scrape]
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال برای اسکرپ دستی'
        required: false
        default: 'IranintlTv'
      add_only_channels:
        description: 'فقط اضافه به لیست بدون اسکرپ — چند کانال با کاما'
        required: false
        default: ''
      channel_name:
        description: 'نام نمایشی کانال'
        required: false
        default: ''
      start_link:
        description: 'لینک پست (دستی خالی = جدیدترین کانال سپس به قبلی‌ها)'
        required: false
        default: ''
      scroll_direction:
        description: 'جهت اسکرول (دستی پیش‌فرض up = آخرین→قبلی)'
        required: false
        default: 'up'
        type: choice
        options: ['up', 'down']
      limit:
        description: 'تعداد پست‌ها (فقط دستی). اتوماتیک: FILL تا ۵۰ یا فقط جدیدها'
        required: false
        default: '50'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'بدون دانلود مدیا'
        type: boolean
        required: false
        default: true
      resume:
        description: 'ادامه از resume_state'
        type: boolean
        required: false
        default: false
      save_screenshots:
        description: 'ذخیره اسکرین‌شات'
        type: boolean
        required: false
        default: false
      max_scroll_attempts:
        description: 'حداکثر تلاش اسکرول'
        required: false
        default: '12'
      timeout_seconds:
        description: 'تایم‌اوت (۰ = پیش‌فرض اسکریپت)'
        required: false
        default: '0'
      auto_extend_timeout:
        description: 'تمدید خودکار تایم‌اوت'
        type: boolean
        required: false
        default: true
      stop_before_id:
        description: 'توقف قبل از این message_id (خالی = از state)'
        required: false
        default: ''
      run_like_hourly:
        description: 'مثل hourly: همه کانال‌های لیست (نادیده گرفتن channel)'
        type: boolean
        required: false
        default: false

concurrency:
  group: telegram-scrape-${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.run_like_hourly == 'true' && 'hourly' || github.event.inputs.channel || 'manual') || 'hourly' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      is_auto: ${{ steps.build.outputs.is_auto }}
    steps:
      - uses: actions/checkout@v4

      - name: Build channel matrix / manage list
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          CHANNEL_INPUT: ${{ github.event.inputs.channel || '' }}
          ADD_ONLY: ${{ github.event.inputs.add_only_channels || '' }}
          RUN_LIKE_HOURLY: ${{ github.event.inputs.run_like_hourly || 'false' }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: |
          python3 << 'PY'
          import json, os, re
          from pathlib import Path

          state_path = Path('State/telegram_news_state.json')
          state_path.parent.mkdir(parents=True, exist_ok=True)

          def load_state():
              if not state_path.exists():
                  return {'channel_list': [], 'channels': {}}
              raw = state_path.read_text(encoding='utf-8')
              try:
                  return json.loads(raw)
              except Exception:
                  cleaned = re.sub(r'^<<<<<<< .*\n', '', raw, flags=re.M)
                  cleaned = re.sub(r'^=======\n', '', cleaned, flags=re.M)
                  cleaned = re.sub(r'^>>>>>>> .*\n', '', cleaned, flags=re.M)
                  try:
                      return json.loads(cleaned)
                  except Exception:
                      return {'channel_list': [], 'channels': {}}

          state = load_state()
          state.setdefault('channel_list', [])
          state.setdefault('channels', {})

          event = os.environ.get('EVENT_NAME', '')
          channel_input = (os.environ.get('CHANNEL_INPUT') or '').strip()
          add_only = (os.environ.get('ADD_ONLY') or '').strip()
          run_like = (os.environ.get('RUN_LIKE_HOURLY') or 'false').lower() == 'true'

          if event == 'workflow_dispatch' and add_only:
              added = []
              for part in add_only.split(','):
                  ch = part.strip().lstrip('@')
                  if ch and ch not in state['channel_list']:
                      state['channel_list'].append(ch)
                      state['channels'].setdefault(ch, {})
                      added.append(ch)
              state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
              print('added only', added)
              with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
                  o.write('matrix=' + json.dumps({'include': []}) + '\n')
                  o.write('is_auto=false\n')
              raise SystemExit(0)

          is_auto = event in ('schedule', 'repository_dispatch') or (event == 'workflow_dispatch' and run_like)

          if is_auto:
              channels = list(state.get('channel_list') or [])
              if not channels:
                  channels = ['IranintlTv']
                  state['channel_list'] = channels
                  state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          else:
              ch = channel_input.lstrip('@') or 'IranintlTv'
              channels = [ch]
              if ch not in state['channel_list']:
                  state['channel_list'].append(ch)
                  state['channels'].setdefault(ch, {})
                  state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          matrix = {'include': [{'channel': c} for c in channels]}
          print('is_auto', is_auto, 'channels', channels)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as o:
              o.write('matrix=' + json.dumps(matrix, ensure_ascii=False) + '\n')
              o.write('is_auto=' + ('true' if is_auto else 'false') + '\n')
          PY

      - name: Commit channel list if changed
        if: steps.build.outputs.is_auto != 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(telegram-news): update channel_list"
          file_pattern: State/telegram_news_state.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

  scrape:
    needs: prepare
    if: needs.prepare.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Patch scraper scroll / jump-to-bottom
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('.github/scripts/scraper.py')
          t = p.read_text(encoding='utf-8')
          if 'JUMP_TO_BOTTOM_PATCH' not in t:
              print('patch marker not found — using repo scraper as-is')
          else:
              print('scroll patch already present')
          PY

      - name: Patch scraper stop_before (newest→saved)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('.github/scripts/scraper.py')
          t = p.read_text(encoding='utf-8')
          if 'stop_before' in t.lower() or 'STOP_BEFORE' in t:
              print('stop_before support present')
          else:
              print('stop_before not in scraper — runtime config only')
          PY

      - name: Patch debug scraper fast-exit (no new posts)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('.github/scripts/debug_scraper.py')
          if p.exists():
              print('debug_scraper present')
          else:
              print('no debug_scraper')
          PY

      - name: Resolve run parameters
        id: params
        env:
          CHANNEL: ${{ matrix.channel }}
          IS_AUTO: ${{ needs.prepare.outputs.is_auto }}
          LIMIT_IN: ${{ github.event.inputs.limit || '50' }}
          DEBUG_IN: ${{ github.event.inputs.debug_mode || 'true' }}
          SCROLL_IN: ${{ github.event.inputs.scroll_direction || 'up' }}
          MAX_MB: ${{ github.event.inputs.max_media_mb || '80' }}
          RESUME_IN: ${{ github.event.inputs.resume || 'false' }}
          SHOTS: ${{ github.event.inputs.save_screenshots || 'false' }}
          MAX_SCROLL: ${{ github.event.inputs.max_scroll_attempts || '12' }}
          TIMEOUT: ${{ github.event.inputs.timeout_seconds || '0' }}
          AUTO_EXT: ${{ github.event.inputs.auto_extend_timeout || 'true' }}
          START_LINK: ${{ github.event.inputs.start_link || '' }}
          CHANNEL_NAME: ${{ github.event.inputs.channel_name || '' }}
          STOP_BEFORE: ${{ github.event.inputs.stop_before_id || '' }}
        run: |
          echo "channel=${CHANNEL}" >> $GITHUB_OUTPUT
          echo "is_auto=${IS_AUTO}" >> $GITHUB_OUTPUT
          echo "limit=${LIMIT_IN}" >> $GITHUB_OUTPUT
          echo "debug_mode=${DEBUG_IN}" >> $GITHUB_OUTPUT
          echo "scroll_direction=${SCROLL_IN}" >> $GITHUB_OUTPUT
          echo "max_media_mb=${MAX_MB}" >> $GITHUB_OUTPUT
          echo "resume=${RESUME_IN}" >> $GITHUB_OUTPUT
          echo "save_screenshots=${SHOTS}" >> $GITHUB_OUTPUT
          echo "max_scroll_attempts=${MAX_SCROLL}" >> $GITHUB_OUTPUT
          echo "timeout_seconds=${TIMEOUT}" >> $GITHUB_OUTPUT
          echo "auto_extend_timeout=${AUTO_EXT}" >> $GITHUB_OUTPUT
          echo "start_link=${START_LINK}" >> $GITHUB_OUTPUT
          echo "channel_name=${CHANNEL_NAME}" >> $GITHUB_OUTPUT
          echo "stop_before_id=${STOP_BEFORE}" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/scripts/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install deps
        run: |
          pip install -r .github/scripts/requirements.txt
          playwright install chromium
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb fonts-liberation fonts-noto-color-emoji 2>/dev/null || true

      - name: Decrypt profile
        env:
          PROFILE_PASSPHRASE: ${{ secrets.BROWSER_PROFILE_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PROFILE_PASSPHRASE" --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          tar -xzf config/browser_profile.tar.gz -C config/

      - name: Write config.yaml
        env:
          CHANNEL: ${{ steps.params.outputs.channel }}
          CHANNEL_NAME: ${{ steps.params.outputs.channel_name }}
          LIMIT: ${{ steps.params.outputs.limit }}
          MAX_MB: ${{ steps.params.outputs.max_media_mb }}
          MAX_SCROLL: ${{ steps.params.outputs.max_scroll_attempts }}
          RESUME: ${{ steps.params.outputs.resume }}
          START_LINK: ${{ steps.params.outputs.start_link }}
          SCROLL: ${{ steps.params.outputs.scroll_direction }}
          SHOTS: ${{ steps.params.outputs.save_screenshots }}
          DEBUG: ${{ steps.params.outputs.debug_mode }}
          TIMEOUT: ${{ steps.params.outputs.timeout_seconds }}
          AUTO_EXT: ${{ steps.params.outputs.auto_extend_timeout }}
          STOP_BEFORE: ${{ steps.params.outputs.stop_before_id }}
          IS_AUTO: ${{ steps.params.outputs.is_auto }}
        run: |
          python -c "
          import yaml, os
          with open('config/config.yaml') as f: c = yaml.safe_load(f) or {}
          c['channel'] = os.environ['CHANNEL']
          c['channel_name'] = os.environ.get('CHANNEL_NAME') or ''
          c['limit'] = int(os.environ.get('LIMIT') or '50')
          c['max_media_mb'] = int(os.environ.get('MAX_MB') or '80')
          c['max_scroll_attempts'] = int(os.environ.get('MAX_SCROLL') or '12')
          resume_val = os.environ.get('RESUME', 'false').lower() == 'true'
          c['resume'] = resume_val
          start_link = (os.environ.get('START_LINK') or '').strip()
          if resume_val:
              c.pop('start_link', None); c['scroll_direction'] = 'up'
          else:
              if start_link: c['start_link'] = start_link
              else: c.pop('start_link', None)
              c['scroll_direction'] = os.environ.get('SCROLL') or 'up'
          c['save_screenshots'] = os.environ.get('SHOTS', 'false').lower() == 'true'
          c['debug_mode'] = os.environ.get('DEBUG', 'true').lower() == 'true'
          c['timeout_seconds'] = int(os.environ.get('TIMEOUT') or '0')
          c['auto_extend_timeout'] = os.environ.get('AUTO_EXT', 'true').lower() == 'true'
          sb = (os.environ.get('STOP_BEFORE') or '').strip()
          if sb:
              c['stop_before_id'] = sb
          else:
              c.pop('stop_before_id', None)
          if os.environ.get('IS_AUTO') == 'true' and not sb:
              import json
              from pathlib import Path
              sp = Path('State/telegram_news_state.json')
              if sp.exists():
                  try:
                      st = json.loads(sp.read_text(encoding='utf-8'))
                      last = (st.get('channels') or {}).get(os.environ['CHANNEL'], {}).get('last_post_id')
                      if last:
                          c['stop_before_id'] = str(last)
                  except Exception as e:
                      print('state read skip', e)
          with open('config/config.yaml', 'w') as f: yaml.dump(c, f, allow_unicode=True, default_flow_style=False)
          print(c)
          "

      - name: Run scraper (media)
        if: steps.params.outputs.debug_mode != 'true'
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 360

      - name: Run debug scraper (text)
        if: steps.params.outputs.debug_mode == 'true'
        run: xvfb-run python .github/scripts/debug_scraper.py
        timeout-minutes: 120

      - name: Verify output
        run: |
          OUT="Download/telegram_downloads/${{ steps.params.outputs.channel }}"
          if [ -d "$OUT" ] && [ -n "$(ls -A "$OUT" 2>/dev/null)" ]; then
            echo "OK output: $OUT"
            ls -la "$OUT" | head -20
          else
            echo "no new output dir (ok if no new posts)"
            exit 0
          fi

      - name: Update state last_post_id
        env:
          CHANNEL: ${{ steps.params.outputs.channel }}
        run: |
          mkdir -p State
          STATE=State/telegram_news_state.json
          [ -f "$STATE" ] || echo '{"channel_list":[],"channels":{}}' > "$STATE"
          export STATE JSON_FILE="Download/telegram_downloads/$CHANNEL/${CHANNEL}_posts.json"
          export RESUME_FILE="Download/telegram_downloads/$CHANNEL/resume_state.json"
          python3 << 'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone
          channel = os.environ["CHANNEL"]
          state_path = Path(os.environ["STATE"])
          try:
              state = json.loads(state_path.read_text(encoding="utf-8"))
          except Exception:
              raw = state_path.read_text(encoding="utf-8") if state_path.exists() else ""
              cleaned = re.sub(r"^<<<<<<< .*$", "", raw, flags=re.M)
              cleaned = re.sub(r"^=======$", "", cleaned, flags=re.M)
              cleaned = re.sub(r"^>>>>>>> .*$", "", cleaned, flags=re.M)
              try:
                  state = json.loads(cleaned)
              except Exception:
                  state = {"channel_list": [], "channels": {}}
          state.setdefault("channel_list", []); state.setdefault("channels", {})
          last_id = None
          jf = Path(os.environ["JSON_FILE"])
          if jf.exists():
              try:
                  posts = json.loads(jf.read_text(encoding="utf-8"))
                  ids = [int(p.get("id") or p.get("message_id") or 0) for p in posts if str(p.get("id") or p.get("message_id") or "").isdigit()]
                  if ids: last_id = str(max(ids))
              except Exception as e:
                  print("posts json skip", e)
          if not last_id:
              rf = Path(os.environ["RESUME_FILE"])
              if rf.exists():
                  try:
                      r = json.loads(rf.read_text(encoding="utf-8"))
                      last_id = str(r.get("last_post_id") or r.get("message_id") or "") or None
                  except Exception:
                      pass
          ch = state["channels"].setdefault(channel, {})
          prev_id = ch.get("last_post_id")
          ch["updated_at"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          if last_id:
              try:
                  if not prev_id or int(last_id) >= int(str(prev_id)):
                      ch["last_post_id"] = last_id
                      print("state advanced", channel, prev_id, "->", last_id)
                  else:
                      print("state keep", channel, prev_id, "(collected max", last_id, ")")
              except Exception:
                  ch["last_post_id"] = last_id
                  print("state set", channel, last_id)
          if channel not in state["channel_list"]:
              state["channel_list"].append(channel)
          state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: Commit results
        run: |
          set +e
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          # never commit runtime config (multi-channel conflict source)
          git checkout -- config/config.yaml 2>/dev/null || true
          git restore --staged config/config.yaml 2>/dev/null || true
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          git fetch origin ${{ github.ref_name }}
          git pull --rebase origin ${{ github.ref_name }}
          if [ $? -ne 0 ]; then
            echo "rebase failed — fallback"
            git rebase --abort 2>/dev/null || true
            git pull --no-rebase origin ${{ github.ref_name }} || true
          fi
          git checkout -- config/config.yaml 2>/dev/null || true
          CHANNEL="${{ steps.params.outputs.channel }}"
          git add "Download/telegram_downloads/${CHANNEL}" State/telegram_news_state.json || true
          git reset HEAD -- config/config.yaml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No scrape artifacts to commit"
          else
            git commit -m "📥 news scrape @${CHANNEL}"
            git push origin HEAD:${{ github.ref_name }} || true
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-${{ steps.params.outputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ steps.params.outputs.channel }}/
