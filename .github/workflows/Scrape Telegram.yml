name: 🌀 Scrape Telegram & Save Archive

on:
  # هر ۱ ساعت یک‌بار (UTC) — کانال‌های داخل State/telegram_news_state.json
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (خالی = همه کانال‌های state در حالت دستی با یک کانال پیش‌فرض)'
        required: false
        default: 'IranintlTv'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم پست (خالی = ادامه از بعد از آخرین پست ذخیره‌شده در state)'
        required: false
        default: ''
      scroll_direction:
        description: 'جهت اسکرول (در ادامه خودکار از state معمولاً down)'
        required: false
        default: 'down'
        type: choice
        options:
          - 'up'
          - 'down'
      limit:
        description: 'تعداد پست‌ها (ساعتی/ادامه خودکار معمولاً تا ۵۰ پست جدید)'
        required: false
        default: '50'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'بدون دانلود مدیا (تمرکز متنی) — در cron همیشه true'
        type: boolean
        required: false
        default: true
      resume:
        description: 'ادامه قدیمی از resume_state (معمولاً برای news خودکار لازم نیست)'
        type: boolean
        required: false
        default: false
      save_screenshots:
        description: 'ذخیره اسکرین‌شات'
        type: boolean
        required: false
        default: false
      save_to:
        description: 'محل ذخیره خروجی'
        required: true
        type: choice
        default: 'repository'
        options:
          - 'artifact'
          - 'repository'
      timeout_seconds:
        description: 'حداکثر زمان اجرا به ثانیه (۰ = پیش‌فرض کد)'
        required: false
        default: '0'
      auto_extend_timeout:
        description: 'تمدید خودکار زمان'
        type: boolean
        required: false
        default: true
      max_scroll_attempts:
        description: 'حداکثر تلاش اسکرول'
        required: false
        default: '12'

permissions:
  contents: write
  actions: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.set.outputs.channels }}
      is_schedule: ${{ steps.set.outputs.is_schedule }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build channel matrix
        id: set
        run: |
          STATE="State/telegram_news_state.json"
          if [ ! -f "$STATE" ]; then
            echo '{"channel_list":["IranintlTv","bbcpersian"],"channels":{}}' > "$STATE"
          fi
          echo "📋 state:"
          cat "$STATE"

          IS_SCHEDULE="false"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            IS_SCHEDULE="true"
          fi
          echo "is_schedule=$IS_SCHEDULE" >> $GITHUB_OUTPUT

          if [ "$IS_SCHEDULE" = "true" ]; then
            CHANNELS=$(python3 -c "
          import json
          d=json.load(open('$STATE'))
          ch=d.get('channel_list') or list((d.get('channels') or {}).keys()) or ['IranintlTv']
          print(json.dumps(ch))
          ")
          else
            CH="${{ github.event.inputs.channel }}"
            CH=$(echo "$CH" | sed 's/^@//' | xargs)
            if [ -z "$CH" ]; then CH="IranintlTv"; fi
            CHANNELS=$(python3 -c "import json; print(json.dumps(['$CH']))")
          fi
          echo "channels=$CHANNELS" >> $GITHUB_OUTPUT
          echo "✅ matrix channels: $CHANNELS (schedule=$IS_SCHEDULE)"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJson(needs.prepare.outputs.channels) }}
    concurrency:
      group: telegram-news-${{ matrix.channel }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1

      - name: Resolve run parameters
        id: params
        run: |
          CHANNEL="${{ matrix.channel }}"
          CHANNEL=$(echo "$CHANNEL" | sed 's/^@//')
          STATE="State/telegram_news_state.json"
          IS_SCHEDULE="${{ needs.prepare.outputs.is_schedule }}"

          if [ "$IS_SCHEDULE" = "true" ]; then
            DEBUG="true"
            SAVE_TO="repository"
            LIMIT="50"
            SCROLL="down"
            SAVE_SHOTS="false"
            RESUME="false"
            START_LINK=""
            CHANNEL_NAME=""
            MAX_MEDIA="80"
            TIMEOUT_SEC="0"
            AUTO_EXT="true"
            MAX_SCROLL="12"
          else
            DEBUG="${{ github.event.inputs.debug_mode }}"
            SAVE_TO="${{ github.event.inputs.save_to }}"
            LIMIT="${{ github.event.inputs.limit }}"
            SCROLL="${{ github.event.inputs.scroll_direction }}"
            SAVE_SHOTS="${{ github.event.inputs.save_screenshots }}"
            RESUME="${{ github.event.inputs.resume }}"
            START_LINK="${{ github.event.inputs.start_link }}"
            CHANNEL_NAME="${{ github.event.inputs.channel_name }}"
            MAX_MEDIA="${{ github.event.inputs.max_media_mb }}"
            TIMEOUT_SEC="${{ github.event.inputs.timeout_seconds }}"
            AUTO_EXT="${{ github.event.inputs.auto_extend_timeout }}"
            MAX_SCROLL="${{ github.event.inputs.max_scroll_attempts }}"
          fi

          LAST_POST=""
          if [ -f "$STATE" ]; then
            LAST_POST=$(python3 -c "
          import json
          d=json.load(open('$STATE'))
          print((d.get('channels') or {}).get('$CHANNEL', {}).get('last_post_id') or '')
          ")
          fi

          if [ -z "$START_LINK" ] && [ -n "$LAST_POST" ] && [ "$RESUME" != "true" ]; then
            START_LINK="https://t.me/${CHANNEL}/${LAST_POST}"
            SCROLL="down"
            echo "🔄 ادامه از آخرین پست state: $LAST_POST (scroll=down)"
          fi

          {
            echo "channel=$CHANNEL"
            echo "channel_name=$CHANNEL_NAME"
            echo "start_link=$START_LINK"
            echo "scroll_direction=$SCROLL"
            echo "limit=$LIMIT"
            echo "max_media_mb=$MAX_MEDIA"
            echo "debug_mode=$DEBUG"
            echo "resume=$RESUME"
            echo "save_screenshots=$SAVE_SHOTS"
            echo "save_to=$SAVE_TO"
            echo "timeout_seconds=$TIMEOUT_SEC"
            echo "auto_extend_timeout=$AUTO_EXT"
            echo "max_scroll_attempts=$MAX_SCROLL"
            echo "last_post_id=$LAST_POST"
          } >> $GITHUB_OUTPUT

          echo "📌 channel=$CHANNEL last=$LAST_POST start=$START_LINK scroll=$SCROLL debug=$DEBUG save_to=$SAVE_TO limit=$LIMIT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Decrypt browser profile
        run: |
          if [ ! -f config/browser_profile.tar.gz.gpg ]; then
            echo "❌ config/browser_profile.tar.gz.gpg یافت نشد"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          tar -xzf config/browser_profile.tar.gz -C config/
          echo "✅ profile ready"

      - name: Update config.yaml
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f) or {}
          c['channel'] = '${{ steps.params.outputs.channel }}'
          c['channel_name'] = '''${{ steps.params.outputs.channel_name }}''' or ''
          c['limit'] = int('${{ steps.params.outputs.limit }}' or '50')
          c['max_media_mb'] = int('${{ steps.params.outputs.max_media_mb }}' or '80')
          c['max_scroll_attempts'] = int('${{ steps.params.outputs.max_scroll_attempts }}' or '12')
          resume_val = '${{ steps.params.outputs.resume }}'.lower() == 'true'
          c['resume'] = resume_val
          start_link = '''${{ steps.params.outputs.start_link }}'''.strip()
          if resume_val:
              c.pop('start_link', None)
              c['scroll_direction'] = 'up'
          else:
              if start_link:
                  c['start_link'] = start_link
              else:
                  c.pop('start_link', None)
              c['scroll_direction'] = '${{ steps.params.outputs.scroll_direction }}' or 'down'
          c['save_screenshots'] = '${{ steps.params.outputs.save_screenshots }}'.lower() == 'true'
          c['debug_mode'] = '${{ steps.params.outputs.debug_mode }}'.lower() == 'true'
          c['timeout_seconds'] = int('${{ steps.params.outputs.timeout_seconds }}' or '0')
          c['auto_extend_timeout'] = '${{ steps.params.outputs.auto_extend_timeout }}'.lower() == 'true'
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          print('config:', c)
          "

      - name: Run scraper (with media)
        if: ${{ steps.params.outputs.debug_mode != 'true' }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml

      - name: Run debug scraper (text only, no media)
        if: ${{ steps.params.outputs.debug_mode == 'true' }}
        run: xvfb-run python .github/scripts/debug_scraper.py

      - name: Verify output
        if: ${{ always() }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ steps.params.outputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A "$OUTPUT_DIR" 2>/dev/null)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output ready"
          ls -la "$OUTPUT_DIR" | head -20

      - name: Update permanent news state
        if: ${{ always() }}
        env:
          CHANNEL: ${{ steps.params.outputs.channel }}
          STATE: State/telegram_news_state.json
          JSON_FILE: Download/telegram_downloads/${{ steps.params.outputs.channel }}/${{ steps.params.outputs.channel }}_posts.json
          RESUME_FILE: Download/telegram_downloads/${{ steps.params.outputs.channel }}/resume_state.json
        run: |
          mkdir -p State
          [ -f "$STATE" ] || echo '{"channel_list":[],"channels":{}}' > "$STATE"
          python3 << 'PY'
          import json, os
          from pathlib import Path
          from datetime import datetime, timezone

          channel = os.environ["CHANNEL"]
          state_path = Path(os.environ["STATE"])
          json_file = Path(os.environ["JSON_FILE"])
          resume_file = Path(os.environ["RESUME_FILE"])

          state = json.loads(state_path.read_text(encoding="utf-8")) if state_path.exists() else {"channel_list": [], "channels": {}}
          state.setdefault("channel_list", [])
          state.setdefault("channels", {})

          last_id = None
          if json_file.exists():
              try:
                  posts = json.loads(json_file.read_text(encoding="utf-8"))
                  ids = []
                  for p in posts:
                      i = p.get("id") or p.get("message_id") or p.get("post_id")
                      if i is not None and str(i).isdigit():
                          ids.append(int(i))
                  if ids:
                      last_id = str(max(ids))
              except Exception as e:
                  print("posts.json read error:", e)

          if not last_id and resume_file.exists():
              try:
                  r = json.loads(resume_file.read_text(encoding="utf-8"))
                  last_id = str(r.get("last_msg_id") or r.get("last_post_id") or "") or None
              except Exception as e:
                  print("resume read error:", e)

          if last_id:
              now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              if channel not in state["channel_list"]:
                  state["channel_list"].append(channel)
              prev = state["channels"].get(channel) or {}
              prev.update({"last_post_id": last_id, "last_updated": now})
              state["channels"][channel] = prev
              state_path.write_text(json.dumps(state, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
              print(f"✅ state @{channel} → last_post_id={last_id}")
          else:
              print("⚠️ last_post_id پیدا نشد — state تغییر نکرد")
          PY

      - name: Setup Git LFS track
        if: ${{ always() }}
        run: |
          git lfs install
          mkdir -p "Download/telegram_downloads/${{ steps.params.outputs.channel }}/media"
          mkdir -p "Download/telegram_downloads/${{ steps.params.outputs.channel }}/post_screenshots"
          git lfs track "Download/telegram_downloads/**/media/*" || true
          git lfs track "Download/telegram_downloads/**/post_screenshots/*" || true
          git add .gitattributes || true

      - name: Pull before commit
        if: ${{ steps.params.outputs.save_to == 'repository' }}
        run: |
          git config pull.rebase true
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage files
        if: ${{ steps.params.outputs.save_to == 'repository' }}
        run: |
          git add "Download/telegram_downloads/${{ steps.params.outputs.channel }}" || true
          git add "State/telegram_news_state.json" || true
          git add .gitattributes || true
          git status --short

      - name: Commit and push
        if: ${{ steps.params.outputs.save_to == 'repository' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 news scrape @${{ steps.params.outputs.channel }} (limit=${{ steps.params.outputs.limit }}, scroll=${{ steps.params.outputs.scroll_direction }})"
          file_pattern: "Download/telegram_downloads/** State/telegram_news_state.json .gitattributes"
          branch: ${{ github.ref_name }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Upload artifact (optional)
        if: ${{ steps.params.outputs.save_to == 'artifact' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: telegram-${{ steps.params.outputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ steps.params.outputs.channel }}/
