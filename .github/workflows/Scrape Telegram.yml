name: 🌀 Scrape Telegram & Save Full Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel username (without @)'
        required: true
        default: 'bbcpersian'
      limit:
        description: 'Number of latest posts to scrape'
        required: false
        default: '10'
      max_media_size_mb:
        description: 'Max media file size (MB)'
        required: false
        default: '80'

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install apify-client requests

      - name: Run Telegram Scraper
        env:
          APIFY_TOKEN_1: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          # در صورت نیاز می‌توانید توکن‌های بیشتری اضافه کنید: APIFY_TOKEN_3, ...
          CHANNEL: ${{ github.event.inputs.channel }}
          POST_LIMIT: ${{ github.event.inputs.limit }}
          MAX_MEDIA_SIZE_MB: ${{ github.event.inputs.max_media_size_mb }}
        run: python .github/scripts/scraper.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update Telegram archive for @${{ github.event.inputs.channel }} (${{ github.event.inputs.limit }} posts)"
          file_pattern: "Download/telegram_downloads/${{ github.event.inputs.channel }}/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
