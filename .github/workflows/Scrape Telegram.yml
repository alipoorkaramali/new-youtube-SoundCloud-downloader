name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال بدون @ (در صورت استفاده از start_link می‌تواند خالی باشد)'
        required: false
        default: 'bbcpersian'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری، برای جستجوی دقیق‌تر)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم به یک پست (اختیاری، مثال: https://t.me/example/123)'
        required: false
        default: ''
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '15'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت دیباگ (اسکرین‌شات از هر مرحله)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ════════════════════════════════════════════
      # ۱. دریافت کد از مخزن (فقط آخرین commit)
      # ════════════════════════════════════════════
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1   # فقط آخرین commit، نه کل تاریخچه

      # ════════════════════════════════════════════
      # ۲. تنظیم پایتون
      # ════════════════════════════════════════════
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ════════════════════════════════════════════
      # ۳. کش بسته‌های pip (وابستگی‌های پایتون)
      # ════════════════════════════════════════════
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ════════════════════════════════════════════
      # ۴. نصب وابستگی‌های پایتون
      # ════════════════════════════════════════════
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ════════════════════════════════════════════
      # ۵. کش مرورگر Playwright (کرومیوم)
      # ════════════════════════════════════════════
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ════════════════════════════════════════════
      # ۶. نصب Playwright و مرورگر کرومیوم
      # ════════════════════════════════════════════
      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      # ════════════════════════════════════════════
      # ۷. استخراج پروفایل مرورگر
      # ════════════════════════════════════════════
      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      # ════════════════════════════════════════════
      # ۸. به‌روزرسانی فایل تنظیمات با ورودی‌ها
      # ════════════════════════════════════════════
      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f)
          c['channel'] = '${{ github.event.inputs.channel }}' or ''
          c['channel_name'] = '${{ github.event.inputs.channel_name }}'
          c['start_link'] = '${{ github.event.inputs.start_link }}'
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          "
          
      # ════════════════════════════════════════════
      # ۸.۵ پاکسازی خروجی قبلی همین کانال
      # ════════════════════════════════════════════
      - name: 🧹 Clean old output for this channel
        run: rm -rf "Download/telegram_downloads/${{ github.event.inputs.channel }}"
      
      # ════════════════════════════════════════════
      # ۹. اجرای اسکریپر (اصلی یا دیباگ)
      # ════════════════════════════════════════════
      - name: 🚀 Run Telegram Scraper
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 35

      - name: 🐞 Run debug script with screenshots
        if: ${{ inputs.debug_mode }}
        run: python .github/scripts/debug_full.py
        timeout-minutes: 35
        
      - name: 🧹 Delete old debug screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("debug-screenshots-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # ════════════════════════════════════════════
      # ۱۰. آپلود اسکرین‌شات‌های دیباگ
      # ════════════════════════════════════════════
      - name: 📤 Upload debug screenshots
        if: ${{ inputs.debug_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: debug_output/

      # ════════════════════════════════════════════
      # ۱۱. بررسی خروجی (فقط در حالت عادی)
      # ════════════════════════════════════════════
      - name: 📊 Verify output
        if: ${{ !inputs.debug_mode }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output directory is ready"

      # ════════════════════════════════════════════
      # ۱۱.۵ تنظیم Git LFS برای فایل‌های رسانه و ZIP
      # ════════════════════════════════════════════
      - name: 🐘 Setup Git LFS track for media & zip
        if: ${{ !inputs.debug_mode }}
        run: |
          git lfs install
          git lfs track "Download/telegram_downloads/**/media/*"
          git add .gitattributes

      # ════════════════════════════════════════════
      # ۱۲. ذخیرهٔ نتایج در مخزن (فقط حالت عادی)
      # ════════════════════════════════════════════
      - name: 💾 Commit and push results
        if: ${{ !inputs.debug_mode }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }})"
          file_pattern: "Download/telegram_downloads/${{ github.event.inputs.channel }}/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}

      # مرحلهٔ جدید پاکسازی آرتیفکت قدیمی
      - name: 🧹 Delete old post screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("post-screenshots-${{ github.event.inputs.channel }}-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ════════════════════════════════════════════
      # ۱۳. آپلود اسکرین‌شات‌های هر پست (همیشه)
      # ════════════════════════════════════════════
      - name: 📸 Upload post screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-screenshots-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots/
