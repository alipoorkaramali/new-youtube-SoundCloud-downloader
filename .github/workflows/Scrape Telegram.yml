name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (برای مسیر خروجی، حتی اگر start_link دارید)'
        required: true
        default: 'bbcpersian'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری، برای جستجوی دقیق‌تر)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم به یک پست (اختیاری، مثال: https://t.me/example/123)'
        required: false
        default: ''
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '15'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت دیباگ (اسکرین‌شات از هر مرحله)'
        type: boolean
        required: false
        default: false
      save_to:
        description: 'محل ذخیره‌سازی خروجی‌ها (در صورت انتخاب دستی، override می‌شود)'
        required: true
        type: choice
        default: 'artifact'
        options:
          - 'artifact'
          - 'repository'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # ════════════════════════════════════════════
      # ۱. دریافت کد از مخزن (فقط آخرین commit)
      # ════════════════════════════════════════════
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1

      # ════════════════════════════════════════════
      # ۲. تنظیم پایتون
      # ════════════════════════════════════════════
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ════════════════════════════════════════════
      # ۳. کش بسته‌های pip
      # ════════════════════════════════════════════
      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ════════════════════════════════════════════
      # ۴. نصب وابستگی‌های پایتون
      # ════════════════════════════════════════════
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ════════════════════════════════════════════
      # ۵. کش مرورگر Playwright
      # ════════════════════════════════════════════
      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # ════════════════════════════════════════════
      # ۶. نصب Playwright و کرومیوم
      # ════════════════════════════════════════════
      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium
          
     # ════════════════════════════════════════════
      # ۷. استخراج پروفایل مرورگر
      # ════════════════════════════════════════════       
      - name: 🔓 Decrypt browser profile
        run: |
          if [ ! -f config/browser_profile.tar.gz.gpg ]; then
            echo "❌ فایل config/browser_profile.tar.gz.gpg یافت نشد!"
            exit 1
          fi
          gpg --batch --yes --passphrase "${{ secrets.COOKIE_DECRYPT_KEY }}" \
              --decrypt config/browser_profile.tar.gz.gpg > config/browser_profile.tar.gz
          if [ ! -s config/browser_profile.tar.gz ]; then
            echo "❌ رمزگشایی پروفایل ناموفق بود یا فایل خالی است"
            exit 1
          fi
          echo "✅ پروفایل با موفقیت رمزگشایی شد"

      # ════════════════════════════════════════════
      # ۷. استخراج پروفایل مرورگر
      # ════════════════════════════════════════════
      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      # ════════════════════════════════════════════
      # ۸. به‌روزرسانی فایل تنظیمات با ورودی‌ها
      # ════════════════════════════════════════════
      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f)
          c['channel'] = '${{ github.event.inputs.channel }}' or 'unknown'
          c['channel_name'] = '${{ github.event.inputs.channel_name }}'
          c['start_link'] = '${{ github.event.inputs.start_link }}'
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          "

      # ════════════════════════════════════════════
      # ۸.۵ پاکسازی خروجی قبلی
      # ════════════════════════════════════════════
      - name: 🧹 Clean old output for this channel
        run: rm -rf "Download/telegram_downloads/${{ github.event.inputs.channel }}"

      # ════════════════════════════════════════════
      # ۸.۶ تعیین حالت ذخیره‌سازی هوشمند (پیش‌فرض بر اساس debug_mode) با لاگ واضح
      # ════════════════════════════════════════════
      - name: 🤖 Smart Save Mode (Default based on debug_mode)
        id: save_mode
        run: |
          if [[ "${{ inputs.debug_mode }}" == "true" ]]; then
            DEFAULT_SAVE="artifact"
            MODE_MSG="Debug Mode ON → Default: Artifact"
          else
            DEFAULT_SAVE="repository"
            MODE_MSG="Normal Mode → Default: Repository"
          fi
          echo "DEFAULT_SAVE=$DEFAULT_SAVE" >> $GITHUB_OUTPUT
          echo "::notice title=📌 Smart Save Mode::$MODE_MSG | Debug=${{ inputs.debug_mode }} | Default=$DEFAULT_SAVE"

      # ════════════════════════════════════════════
      # ۹. اجرای اسکریپر (عادی یا دیباگ)
      # ════════════════════════════════════════════
      - name: 🚀 Run Telegram Scraper
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 35

      - name: 🐞 Run Debug Scraper
        if: ${{ inputs.debug_mode }}
        run: xvfb-run python .github/scripts/debug_scraper.py
        timeout-minutes: 35

      # ════════════════════════════════════════════
      # ۱۰. پاکسازی آرتیفکت‌های قدیمی دیباگ
      # ════════════════════════════════════════════
      - name: 🧹 Delete old debug screenshots artifacts
        if: ${{ inputs.save_to == 'artifact' }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("debug-screenshots-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ════════════════════════════════════════════
      # ۱۱. آپلود اسکرین‌شات‌های دیباگ
      # ════════════════════════════════════════════
      - name: 📤 Upload debug screenshots
        if: ${{ inputs.save_to == 'artifact' && inputs.debug_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/debug_screenshots/

      # ════════════════════════════════════════════
      # ۱۲. بررسی خروجی (همیشه)
      # ════════════════════════════════════════════
      - name: 📊 Verify output
        if: ${{ always() }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output directory is ready"

      # ════════════════════════════════════════════
      # ۱۲.۵ تنظیم Git LFS
      # ════════════════════════════════════════════
      - name: 🐘 Setup Git LFS track for media & zip
        if: ${{ !inputs.debug_mode }}
        run: |
          git lfs install
          git lfs track "Download/telegram_downloads/**/media/*"
          git add .gitattributes

      # ════════════════════════════════════════════
      # ۱۳. کامیت و آپلود نتایج (با منطق هوشمند و لاگ اضافی)
      # ════════════════════════════════════════════
      # ════════════════════════════════════════════
      # ۱۳. کامیت و آپلود نتایج
      # ════════════════════════════════════════════

      # ─────────────────────────────────────────────
      # ۱۳-الف: Pull latest changes (قبل از stage)
      # ─────────────────────────────────────────────
      - name: 🔄 Pull latest changes before staging
        if: ${{ inputs.save_to == 'repository' }}
        run: |
          git config pull.rebase true
          git pull origin ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # ۱۳-ب: Stage کردن فایل‌ها با git add صریح
      # ─────────────────────────────────────────────
      - name: 🗃 Stage all generated files for commit
        if: ${{ inputs.save_to == 'repository' }}
        run: |
          echo "📂 مسیر خروجی: Download/telegram_downloads/${{ github.event.inputs.channel }}"
          ls -la "Download/telegram_downloads/${{ github.event.inputs.channel }}" || echo "پوشه خالی است"
          git add -f "Download/telegram_downloads/${{ github.event.inputs.channel }}/**"
          git add -f .gitattributes
          echo "📋 وضعیت فایل‌های staged:"
          git status --short
          
      # ─────────────────────────────────────────────
      # ۱۳-ج: Commit و Push با git-auto-commit-action
      # ─────────────────────────────────────────────
      - name: 💾 Commit and push results
        if: ${{ inputs.save_to == 'repository' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }})"
          file_pattern: "Download/telegram_downloads/**"
          branch: ${{ github.ref_name }}
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          add_options: "--force"
          push_options: "--force-with-lease"
      # ════════════════════════════════════════════
      # ۱۴. پاکسازی آرتیفکت‌های قدیمی پست‌ها
      # ════════════════════════════════════════════
      - name: 🧹 Delete old post screenshots artifacts
        if: ${{ inputs.save_to == 'artifact' }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("post-screenshots-${{ github.event.inputs.channel }}-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ════════════════════════════════════════════
      # ۱۵. آپلود اسکرین‌شات‌های هر پست (همیشه)
      # ════════════════════════════════════════════
      - name: 📸 Upload post screenshots
        uses: actions/upload-artifact@v4
        if: ${{ inputs.save_to == 'artifact' && always() }}
        with:
          name: post-screenshots-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots/
