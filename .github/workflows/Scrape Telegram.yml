name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کانال بدون @'
        required: true
        default: 'bbcpersian'
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '15'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f)
          c['channel'] = '${{ github.event.inputs.channel }}'
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          "

      - name: 🚀 Run Telegram Scraper
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_API_TOKEN_2 }}
        run: python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 35

      - name: 📊 Verify output
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output directory is ready"

      - name: 💾 Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }})"
          file_pattern: "Download/telegram_downloads/${{ github.event.inputs.channel }}/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}
