name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال بدون @'
        required: true
        default: 'bbcpersian'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری)'
        required: false
        default: ''
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '15'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت دیباگ'
        type: boolean
        required: false
        default: false
      resume_mode:
        description: 'نحوهٔ ادامه'
        required: true
        type: choice
        default: 'auto'
        options:
          - auto
          - manual
          - off
      start_from:
        description: 'شناسهٔ پست برای شروع دستی'
        required: false
        default: ''
      max_scroll_attempts:
        description: 'حداکثر تلاش اسکرول (مخصوص جستجوی پست هدف)'
        required: false
        default: '30'

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              c = yaml.safe_load(f)
          c['channel'] = '${{ github.event.inputs.channel }}'
          c['channel_name'] = '${{ github.event.inputs.channel_name }}'
          c['limit'] = ${{ github.event.inputs.limit }}
          c['max_media_mb'] = ${{ github.event.inputs.max_media_mb }}
          c['max_scroll_attempts'] = ${{ github.event.inputs.max_scroll_attempts }}
          mode = '${{ github.event.inputs.resume_mode }}'
          if mode == 'auto':
              c['resume'] = True
              c['start_from'] = ''
          elif mode == 'manual':
              c['resume'] = False
              c['start_from'] = '${{ github.event.inputs.start_from }}'
          else:
              c['resume'] = False
              c['start_from'] = ''
          with open('config/config.yaml', 'w') as f:
              yaml.dump(c, f, default_flow_style=False, allow_unicode=True)
          "

      - name: 🧹 Clean old output for this channel
        run: rm -rf "Download/telegram_downloads/${{ github.event.inputs.channel }}"

      - name: 🚀 Run Telegram Scraper
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 35

      - name: 🐞 Run debug script with screenshots
        if: ${{ inputs.debug_mode }}
        run: python .github/scripts/debug_full.py
        timeout-minutes: 35

      - name: 🧹 Delete old debug screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("debug-screenshots-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload debug screenshots
        if: ${{ inputs.debug_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: debug_output/

      - name: 📊 Verify output
        if: ${{ !inputs.debug_mode }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found"
            exit 1
          fi
          echo "✅ Output directory is ready"

      - name: 📌 Stage State files explicitly
        if: ${{ !inputs.debug_mode }}
        run: |
          if [ -d "State" ]; then
            git add State/
            echo "✅ State folder staged for commit."
          else
            echo "⚠️ State folder not found, skipping."
          fi

      - name: 🐘 Setup Git LFS track for media & zip
        if: ${{ !inputs.debug_mode }}
        run: |
          git lfs install
          git lfs track "Download/telegram_downloads/**/media/*"
          git add .gitattributes

      - name: 💾 Commit and push results
        if: ${{ !inputs.debug_mode }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }})"
          file_pattern: |
            Download/telegram_downloads/${{ github.event.inputs.channel }}/**
            State/**
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}

      - name: 🧹 Delete old post screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("post-screenshots-${{ github.event.inputs.channel }}-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📸 Upload post screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-screenshots-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots/
