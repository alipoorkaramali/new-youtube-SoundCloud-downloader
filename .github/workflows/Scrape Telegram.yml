name: 🌀 Scrape Telegram & Save Archive

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کاربری کانال (برای مسیر خروجی)'
        required: true
        default: 'bbcpersian'
      channel_name:
        description: 'نام نمایشی کانال (اختیاری)'
        required: false
        default: ''
      start_link:
        description: 'لینک مستقیم به پست (اختیاری)'
        required: false
        default: ''
      limit:
        description: 'تعداد پست‌ها'
        required: false
        default: '15'
      max_media_mb:
        description: 'حداکثر حجم رسانه (MB)'
        required: false
        default: '80'
      debug_mode:
        description: 'حالت دیباگ (اسکرین‌شات از هر مرحله)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.channel }}
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true
          fetch-depth: 1
          # persist-credentials: false  # حذف شد تا git-auto-commit کار کند

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 💾 Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 💾 Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}-v2
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🎭 Install Playwright and Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: 📂 Extract browser profile
        run: tar -xzf config/browser_profile.tar.gz -C config/

      - name: 🔍 Validate inputs
        run: |
          if [[ -z "${{ github.event.inputs.channel }}" ]]; then
            echo "❌ Channel name is required"
            exit 1
          fi
          echo "✅ Channel: ${{ github.event.inputs.channel }} | Limit: ${{ github.event.inputs.limit }}"

      - name: ⚙️ Update config.yaml with inputs
        run: |
          python -c '
          import yaml
          import os
          with open("config/config.yaml", "r", encoding="utf-8") as f:
              config = yaml.safe_load(f)
          
          config["channel"] = os.getenv("INPUT_CHANNEL") or "unknown"
          config["channel_name"] = os.getenv("INPUT_CHANNEL_NAME") or ""
          config["start_link"] = os.getenv("INPUT_START_LINK") or ""
          config["limit"] = int(os.getenv("INPUT_LIMIT", 15))
          config["max_media_mb"] = int(os.getenv("INPUT_MAX_MEDIA_MB", 80))
          
          with open("config/config.yaml", "w", encoding="utf-8") as f:
              yaml.dump(config, f, default_flow_style=False, allow_unicode=True)
          '
        env:
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_CHANNEL_NAME: ${{ github.event.inputs.channel_name }}
          INPUT_START_LINK: ${{ github.event.inputs.start_link }}
          INPUT_LIMIT: ${{ github.event.inputs.limit }}
          INPUT_MAX_MEDIA_MB: ${{ github.event.inputs.max_media_mb }}

      - name: 🧹 Clean old output for this channel
        run: rm -rf "Download/telegram_downloads/${{ github.event.inputs.channel }}"

      - name: 🚀 Run Telegram Scraper
        if: ${{ !inputs.debug_mode }}
        run: xvfb-run python .github/scripts/main.py --config config/config.yaml
        timeout-minutes: 35

      - name: 🐞 Run Debug Scraper
        if: ${{ inputs.debug_mode }}
        run: xvfb-run python .github/scripts/debug_scraper.py
        timeout-minutes: 35

      - name: 🧹 Delete old debug screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("debug-screenshots-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📤 Upload debug screenshots
        if: ${{ inputs.debug_mode }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/debug_screenshots/

      - name: 📊 Verify output
        if: ${{ !inputs.debug_mode }}
        run: |
          OUTPUT_DIR="Download/telegram_downloads/${{ github.event.inputs.channel }}"
          if [ ! -d "$OUTPUT_DIR" ] || [ -z "$(ls -A $OUTPUT_DIR)" ]; then
            echo "❌ No output found for channel ${{ github.event.inputs.channel }}"
            exit 1
          fi
          echo "✅ Output directory is ready"

      - name: 🐘 Setup Git LFS track for media
        if: ${{ !inputs.debug_mode }}
        run: |
          git lfs install
          git lfs track "Download/telegram_downloads/**/media/*"
          git add .gitattributes

      - name: 💾 Commit and push results
        if: ${{ !inputs.debug_mode }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📥 Update archive for @${{ github.event.inputs.channel }} (limit=${{ github.event.inputs.limit }})"
          file_pattern: "Download/telegram_downloads/${{ github.event.inputs.channel }}/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          branch: ${{ github.ref_name }}

      - name: 🧹 Delete old post screenshots artifacts
        run: |
          ids=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name | startswith("post-screenshots-${{ github.event.inputs.channel }}-")) | .id')
          for id in $ids; do
            gh api repos/${{ github.repository }}/actions/artifacts/$id -X DELETE
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📸 Upload post screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-screenshots-${{ github.event.inputs.channel }}-${{ github.run_id }}
          path: Download/telegram_downloads/${{ github.event.inputs.channel }}/post_screenshots/